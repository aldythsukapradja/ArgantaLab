<!--
id: nav-top
name: Top navigation
category: navigation
suitableFor: application, website
description: Sticky top bar — brand mark left, up to four links, collapses to a full-width sheet with a hamburger toggle below 720px.
tags: nav, navigation, header, top bar, menu, hamburger
-->
<style>
  .blk-nav-top{
    --nt-line: color-mix(in srgb, var(--brand-ink,#f4f2ff) 12%, transparent);
    --nt-soft: color-mix(in srgb, var(--brand-ink,#f4f2ff) 6%, transparent);
    position: sticky; top: 0; z-index: 20;
    font-family: var(--brand-font-body, system-ui, sans-serif);
    color: var(--brand-ink,#f4f2ff);
    background: var(--brand-bg,#12101f);
    border-bottom: 1px solid var(--nt-line);
  }
  .blk-nav-top .nt-bar{
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px clamp(16px, 5vw, 40px); max-width: 1200px; margin: 0 auto;
  }
  .blk-nav-top .nt-brand{
    font-family: var(--brand-font-head, Georgia, serif); font-size: 18px; font-weight: 700;
    color: var(--brand-ink,#f4f2ff); text-decoration: none;
  }
  .blk-nav-top .nt-links{ display: none; list-style: none; margin: 0; padding: 0; gap: 28px; }
  .blk-nav-top .nt-links a{
    color: var(--brand-ink,#f4f2ff); text-decoration: none; font-size: 14.5px; opacity: .85;
    padding: 8px 0; display: inline-block; min-height: 32px;
  }
  .blk-nav-top .nt-links a:hover{ opacity: 1; }
  .blk-nav-top .nt-links a:focus-visible{ outline: 2px solid var(--brand-accent,#8b7bff); outline-offset: 3px; border-radius: 4px; }
  .blk-nav-top .nt-toggle{
    display: grid; place-items: center; width: 44px; height: 44px; border-radius: 10px;
    border: 1px solid var(--nt-line); background: var(--nt-soft); color: var(--brand-ink,#f4f2ff); cursor: pointer;
  }
  .blk-nav-top .nt-toggle:focus-visible{ outline: 2px solid var(--brand-accent,#8b7bff); outline-offset: 2px; }
  .blk-nav-top .nt-sheet{
    display: none; flex-direction: column; padding: 4px clamp(16px, 5vw, 40px) 18px;
    border-top: 1px solid var(--nt-line);
  }
  .blk-nav-top[data-open] .nt-sheet{ display: flex; }
  .blk-nav-top .nt-sheet a{
    color: var(--brand-ink,#f4f2ff); text-decoration: none; font-size: 16px; padding: 13px 0; min-height: 44px;
    border-bottom: 1px solid var(--nt-line);
  }
  .blk-nav-top .nt-sheet a:last-child{ border-bottom: 0; }
  @media (min-width: 720px){
    .blk-nav-top .nt-links{ display: flex; }
    .blk-nav-top .nt-toggle{ display: none; }
  }
</style>

<nav class="blk blk-nav-top" aria-label="Primary">
  <div class="nt-bar">
    <a class="nt-brand" href="#" data-fill="brand-name">Arganta</a>
    <ul class="nt-links" data-fill="links">
      <li><a href="#">Product</a></li>
      <li><a href="#">Pricing</a></li>
      <li><a href="#">About</a></li>
    </ul>
    <button class="nt-toggle" type="button" aria-expanded="false" aria-label="Open menu">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M2 5h14M2 9h14M2 13h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="nt-sheet" data-fill="sheet-links" hidden>
    <a href="#">Product</a>
    <a href="#">Pricing</a>
    <a href="#">About</a>
  </div>
</nav>

<script>
(function () {
  document.querySelectorAll('.blk-nav-top').forEach(function (root) {
    if (root.dataset.wired) return; root.dataset.wired = '1';
    var btn = root.querySelector('.nt-toggle');
    var sheet = root.querySelector('.nt-sheet');
    var uid = 'nt-sheet-' + Math.random().toString(36).slice(2, 9);
    sheet.id = uid; btn.setAttribute('aria-controls', uid);
    function close() { root.removeAttribute('data-open'); btn.setAttribute('aria-expanded', 'false'); sheet.hidden = true; }
    function open() { root.setAttribute('data-open', ''); btn.setAttribute('aria-expanded', 'true'); sheet.hidden = false; }
    btn.addEventListener('click', function () { root.hasAttribute('data-open') ? close() : open(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && root.hasAttribute('data-open')) { close(); btn.focus(); } });
  });
})();
</script>
