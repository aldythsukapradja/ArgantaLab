<!--
id: gallery
name: Gallery
category: gallery
suitableFor: website
description: Masonry-style gallery via CSS columns — SVG-placeholder panels with a caption overlay on hover/focus. Empty state when there are no items.
tags: gallery, masonry, images, portfolio, grid
-->
<style>
  .blk-gallery{
    --gl-line: color-mix(in srgb, var(--brand-ink,#f4f2ff) 12%, transparent);
    --gl-mut:  color-mix(in srgb, var(--brand-ink,#f4f2ff) 55%, transparent);
    font-family: var(--brand-font-body, system-ui, sans-serif);
    color: var(--brand-ink,#f4f2ff);
    background: var(--brand-bg,#12101f);
    padding: clamp(32px, 6vw, 64px) clamp(16px, 5vw, 64px);
  }
  .blk-gallery .gl-cols{ column-count: 2; column-gap: 14px; max-width: 1080px; margin: 0 auto; }
  .blk-gallery .gl-item{
    position: relative; break-inside: avoid; margin-bottom: 14px; border-radius: 14px; overflow: hidden;
    border: 1px solid var(--gl-line); display: block;
  }
  .blk-gallery .gl-item svg{ width: 100%; height: auto; display: block; }
  .blk-gallery .gl-cap{
    position: absolute; inset: auto 0 0 0; padding: 12px 14px; font-size: 13px;
    background: linear-gradient(0deg, color-mix(in srgb, var(--brand-bg,#12101f) 85%, transparent), transparent);
    opacity: 0; transition: opacity .18s ease-out;
  }
  .blk-gallery .gl-item:hover .gl-cap, .blk-gallery .gl-item:focus-visible .gl-cap{ opacity: 1; }
  .blk-gallery .gl-item:focus-visible{ outline: 2px solid var(--brand-accent,#8b7bff); outline-offset: 2px; }
  .blk-gallery .gl-empty{ display: none; align-items: center; gap: 10px; color: var(--gl-mut); font-size: 13.5px; padding: 24px 0; }
  .blk-gallery[data-empty] .gl-cols{ display: none; }
  .blk-gallery[data-empty] .gl-empty{ display: flex; }
  @media (min-width: 720px){ .blk-gallery .gl-cols{ column-count: 3; } }
  @media (prefers-reduced-motion: reduce){ .blk-gallery .gl-cap{ transition: none; } }
</style>

<section class="blk blk-gallery" data-empty>
  <div class="gl-cols" data-fill="items">
    <a class="gl-item" href="#" tabindex="0">
      <svg viewBox="0 0 300 220" role="presentation"><rect width="300" height="220" fill="var(--brand-mid,#2a2450)"/><circle cx="90" cy="70" r="50" fill="var(--brand-accent,#8b7bff)" opacity=".3"/></svg>
      <span class="gl-cap" data-fill="caption-1">Untitled</span>
    </a>
    <a class="gl-item" href="#" tabindex="0">
      <svg viewBox="0 0 300 340" role="presentation"><rect width="300" height="340" fill="var(--brand-mid,#2a2450)"/><path d="M0 260 Q150 200 300 250 V340 H0 Z" fill="color-mix(in srgb, var(--brand-ink,#f4f2ff) 10%, transparent)"/></svg>
      <span class="gl-cap" data-fill="caption-2">Untitled</span>
    </a>
    <a class="gl-item" href="#" tabindex="0">
      <svg viewBox="0 0 300 260" role="presentation"><rect width="300" height="260" fill="var(--brand-mid,#2a2450)"/><circle cx="210" cy="90" r="60" fill="var(--brand-accent,#8b7bff)" opacity=".22"/></svg>
      <span class="gl-cap" data-fill="caption-3">Untitled</span>
    </a>
    <a class="gl-item" href="#" tabindex="0">
      <svg viewBox="0 0 300 200" role="presentation"><rect width="300" height="200" fill="var(--brand-mid,#2a2450)"/></svg>
      <span class="gl-cap" data-fill="caption-4">Untitled</span>
    </a>
  </div>
  <div class="gl-empty">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="2.5" y="3" width="13" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/><circle cx="6.5" cy="7.5" r="1.4" stroke="currentColor" stroke-width="1.3"/><path d="M4 12.5 8 9l2.2 2 2-2.2 1.8 2" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
    <span>No images yet.</span>
  </div>
</section>
