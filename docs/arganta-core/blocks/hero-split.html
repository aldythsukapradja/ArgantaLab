<!--
id: hero-split
name: Split hero
category: hero
suitableFor: website
description: Text left, media panel right — stacks to a single column on mobile. Media slot ships as an inline-SVG placeholder pattern (no image dependency).
tags: hero, header, landing, banner, split, media
-->
<style>
  .blk-hero-split{
    font-family: var(--brand-font-body, system-ui, sans-serif);
    color: var(--brand-ink,#f4f2ff);
    background: var(--brand-bg,#12101f);
    padding: clamp(48px, 9vw, 96px) clamp(16px, 6vw, 64px);
  }
  .blk-hero-split .hs-grid{
    display: grid; gap: clamp(28px, 5vw, 56px); max-width: 1120px; margin: 0 auto;
    grid-template-columns: 1fr; align-items: center;
  }
  .blk-hero-split .hs-overline{
    font-size: 12px; text-transform: uppercase; letter-spacing: .2em;
    color: color-mix(in srgb, var(--brand-ink,#f4f2ff) 65%, transparent); margin: 0 0 16px;
  }
  .blk-hero-split .hs-title{
    font-family: var(--brand-font-head, Georgia, serif);
    font-size: clamp(30px, 5vw, 48px); line-height: 1.1; font-weight: 700; margin: 0;
  }
  .blk-hero-split .hs-sub{
    font-size: clamp(15px, 1.6vw, 17px); line-height: 1.55; max-width: 46ch; margin: 18px 0 0;
    color: color-mix(in srgb, var(--brand-ink,#f4f2ff) 80%, transparent);
  }
  .blk-hero-split .hs-cta{
    display: inline-flex; align-items: center; gap: 8px; margin-top: 26px;
    background: var(--brand-accent,#8b7bff); color: var(--brand-paper,#ffffff);
    padding: 13px 26px; border-radius: 999px; font-weight: 700; font-size: 15px;
    text-decoration: none; min-height: 44px;
  }
  .blk-hero-split .hs-cta:focus-visible{ outline: 2px solid var(--brand-accent,#8b7bff); outline-offset: 3px; }
  .blk-hero-split .hs-media{
    aspect-ratio: 4 / 3; border-radius: 18px; overflow: hidden; position: relative;
    background: color-mix(in srgb, var(--brand-ink,#f4f2ff) 6%, transparent);
    border: 1px solid color-mix(in srgb, var(--brand-ink,#f4f2ff) 12%, transparent);
  }
  .blk-hero-split .hs-media svg{ width: 100%; height: 100%; display: block; }
  @media (min-width: 720px){
    .blk-hero-split .hs-grid{ grid-template-columns: 1fr 1fr; }
  }
</style>

<section class="blk blk-hero-split">
  <div class="hs-grid">
    <div>
      <p class="hs-overline" data-fill="overline">Overline</p>
      <h1 class="hs-title" data-fill="title">Tell the story in one strong line</h1>
      <p class="hs-sub" data-fill="sub">A second sentence that explains the value, plainly.</p>
      <a class="hs-cta" href="#" data-fill="cta">Try it now</a>
    </div>
    <div class="hs-media" data-fill="media" aria-hidden="true">
      <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="presentation">
        <rect width="400" height="300" fill="var(--brand-mid,#2a2450)"/>
        <circle cx="120" cy="90" r="70" fill="var(--brand-accent,#8b7bff)" opacity=".35"/>
        <circle cx="290" cy="210" r="100" fill="var(--brand-accent,#8b7bff)" opacity=".2"/>
        <path d="M0 230 Q100 170 200 220 T400 190 V300 H0 Z" fill="color-mix(in srgb, var(--brand-ink,#f4f2ff) 8%, transparent)"/>
      </svg>
    </div>
  </div>
</section>
