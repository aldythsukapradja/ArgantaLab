<!--
id: hero-centered
name: Centered hero
category: hero
suitableFor: website
description: Centered hero — overline, large headline, supporting line, one accent CTA pill, subtle radial accent glow.
tags: hero, header, landing, banner, headline, cta
-->
<style>
  .blk-hero-centered{
    --hc-glow: color-mix(in srgb, var(--brand-accent,#8b7bff) 22%, transparent);
    font-family: var(--brand-font-body, system-ui, sans-serif);
    color: var(--brand-ink,#f4f2ff);
    background:
      radial-gradient(60% 55% at 50% 0%, var(--hc-glow), transparent),
      var(--brand-bg,#12101f);
    text-align: center;
    padding: clamp(64px, 12vw, 128px) clamp(16px, 6vw, 64px);
  }
  .blk-hero-centered .hc-inner{ max-width: 720px; margin: 0 auto; }
  .blk-hero-centered .hc-overline{
    font-size: 12px; text-transform: uppercase; letter-spacing: .22em;
    color: color-mix(in srgb, var(--brand-ink,#f4f2ff) 65%, transparent);
    margin: 0 0 18px;
  }
  .blk-hero-centered .hc-title{
    font-family: var(--brand-font-head, Georgia, serif);
    font-size: clamp(34px, 7vw, 64px); line-height: 1.06; font-weight: 700; margin: 0;
  }
  .blk-hero-centered .hc-sub{
    font-size: clamp(15px, 2vw, 19px); line-height: 1.55; max-width: 46ch; margin: 20px auto 0;
    color: color-mix(in srgb, var(--brand-ink,#f4f2ff) 80%, transparent);
  }
  .blk-hero-centered .hc-cta{
    display: inline-flex; align-items: center; gap: 8px; margin-top: 30px;
    background: var(--brand-accent,#8b7bff); color: var(--brand-paper,#ffffff);
    padding: 13px 26px; border-radius: 999px; font-weight: 700; font-size: 15px;
    text-decoration: none; min-height: 44px;
  }
  .blk-hero-centered .hc-cta:hover{ opacity: .92; }
  .blk-hero-centered .hc-cta:focus-visible{ outline: 2px solid var(--brand-accent,#8b7bff); outline-offset: 3px; }
</style>

<section class="blk blk-hero-centered">
  <div class="hc-inner">
    <p class="hc-overline" data-fill="overline">Overline</p>
    <h1 class="hc-title" data-fill="title">A headline that sets the tone</h1>
    <p class="hc-sub" data-fill="sub">One clear sentence about what this is and who it's for.</p>
    <a class="hc-cta" href="#">
      <span data-fill="cta">Get started</span>
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3 7h8M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</section>
