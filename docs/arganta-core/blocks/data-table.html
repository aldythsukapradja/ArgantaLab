<!--
id: data-table
name: Data table
category: table
suitableFor: application
description: Hairline-row table with a sticky header and right-aligned numeric column. Collapses to stacked label/value cards below 720px (pure CSS, no JS). Empty state when there are no rows.
tags: table, data, list, records, rows
-->
<style>
  .blk-data-table{
    --dt-line: color-mix(in srgb, var(--brand-ink,#f4f2ff) 12%, transparent);
    --dt-mut:  color-mix(in srgb, var(--brand-ink,#f4f2ff) 55%, transparent);
    font-family: var(--brand-font-body, system-ui, sans-serif);
    color: var(--brand-ink,#f4f2ff);
    background: color-mix(in srgb, var(--brand-ink,#f4f2ff) 6%, transparent);
    border: 1px solid var(--dt-line); border-radius: 14px; overflow: hidden;
  }
  .blk-data-table table{ width: 100%; border-collapse: collapse; font-size: 14px; }
  .blk-data-table thead th{
    position: sticky; top: 0; text-align: left; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .11em; color: var(--dt-mut); font-weight: 600; padding: 12px 16px;
    background: color-mix(in srgb, var(--brand-bg,#12101f) 92%, var(--brand-ink,#f4f2ff) 8%);
    border-bottom: 1px solid var(--dt-line);
  }
  .blk-data-table thead th[data-num]{ text-align: right; }
  .blk-data-table tbody td{ padding: 13px 16px; border-bottom: 1px solid var(--dt-line); }
  .blk-data-table tbody tr:last-child td{ border-bottom: 0; }
  .blk-data-table td[data-num]{ text-align: right; font-variant-numeric: tabular-nums; }
  .blk-data-table .dt-empty{
    display: none; align-items: center; gap: 10px; color: var(--dt-mut); font-size: 13.5px; padding: 32px 20px;
  }
  .blk-data-table[data-empty] table{ display: none; }
  .blk-data-table[data-empty] .dt-empty{ display: flex; }
  @media (max-width: 719.98px){
    .blk-data-table thead{ display: none; }
    .blk-data-table table, .blk-data-table tbody, .blk-data-table tr, .blk-data-table td{ display: block; width: 100%; }
    .blk-data-table tr{ padding: 12px 16px; border-bottom: 1px solid var(--dt-line); }
    .blk-data-table tbody tr:last-child{ border-bottom: 0; }
    .blk-data-table td{ padding: 4px 0; border-bottom: 0; display: flex; justify-content: space-between; gap: 12px; }
    .blk-data-table td[data-num]{ text-align: right; }
    .blk-data-table td::before{ content: attr(data-label); color: var(--dt-mut); font-size: 12.5px; }
  }
</style>

<section class="blk blk-data-table" data-empty>
  <table>
    <thead>
      <tr data-fill="columns">
        <th scope="col">Item</th>
        <th scope="col">Category</th>
        <th scope="col" data-num>Amount</th>
      </tr>
    </thead>
    <tbody data-fill="rows">
      <tr><td data-label="Item">Groceries</td><td data-label="Category">Household</td><td data-label="Amount" data-num>$64.20</td></tr>
      <tr><td data-label="Item">Studio subscription</td><td data-label="Category">Software</td><td data-label="Amount" data-num>$29.00</td></tr>
      <tr><td data-label="Item">Coffee</td><td data-label="Category">Food</td><td data-label="Amount" data-num>$5.50</td></tr>
    </tbody>
  </table>
  <div class="dt-empty">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="2.5" y="4" width="13" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 7.5h13" stroke="currentColor" stroke-width="1.5"/></svg>
    <span>No entries yet.</span>
  </div>
</section>
