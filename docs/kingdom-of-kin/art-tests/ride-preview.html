<!DOCTYPE html><html><head><meta charset="utf-8"><style>
  body{margin:0;background:#7cb85f;font-family:system-ui;display:flex;gap:8px;flex-wrap:wrap;padding:16px}
  .cell{background:#8fce6f;border-radius:12px;padding:8px;text-align:center;color:#245}
  .lab{font-size:12px;font-weight:700;margin-top:4px}
  .rig{position:relative}
  .mount-svg{position:absolute;inset:0}
  .buddy{position:absolute}
</style></head><body>
<div id="root"></div>
<script>
const MOUNT = '/apps/web/public/assets/mounts/arganterion.png';
// exact Buddy default look (blue skin + chef hat), viewBox 0 0 100 100
const BUDDY = `<svg viewBox="0 0 100 100" width="100%" height="100%">
  <ellipse cx="30" cy="28" rx="9" ry="14" fill="#0e7490"/><ellipse cx="70" cy="28" rx="9" ry="14" fill="#0e7490"/>
  <ellipse cx="50" cy="55" rx="33" ry="31" fill="#22b8d8"/><ellipse cx="40" cy="40" rx="14" ry="10" fill="#fff" opacity="0.15"/>
  <circle cx="40" cy="52" r="8.5" fill="#fff"/><circle cx="60" cy="52" r="8.5" fill="#fff"/>
  <circle cx="40" cy="52" r="4.6" fill="#1e1b34"/><circle cx="60" cy="52" r="4.6" fill="#1e1b34"/>
  <circle cx="41.6" cy="50.6" r="1.8" fill="#fff"/><circle cx="61.6" cy="50.6" r="1.8" fill="#fff"/>
  <ellipse cx="30" cy="63" rx="6" ry="4" fill="#ff9ec4" opacity="0.32"/><ellipse cx="70" cy="63" rx="6" ry="4" fill="#ff9ec4" opacity="0.32"/>
  <path d="M41 64 Q50 70 59 64" stroke="#3a1f4d" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <rect x="36" y="14" width="28" height="12" rx="3" fill="#fff"/><ellipse cx="42" cy="12" rx="7" ry="7" fill="#fff"/><ellipse cx="50" cy="9" rx="8" ry="8" fill="#fff"/><ellipse cx="58" cy="12" rx="7" ry="7" fill="#fff"/>
</svg>`;
const S = 200; // container size
// candidates: [label, riderScale, topPct, xPct]
const C = [
  ['current .60 / 6%', 0.60, 6, 50],
  ['.54 / 20%', 0.54, 20, 49],
  ['.50 / 26%', 0.50, 26, 49],
  ['.46 / 30%', 0.46, 30, 48],
  ['.50 / 22% back', 0.50, 22, 45],
  ['.44 / 32%', 0.44, 32, 48],
];
const root = document.getElementById('root');
root.innerHTML = C.map(([lab,sc,top,x])=>`
  <div class="cell">
    <div class="rig" style="width:${S}px;height:${S}px">
      <svg class="mount-svg" viewBox="0 0 100 100"><image href="${MOUNT}" x="6" y="4" width="88" height="88" preserveAspectRatio="xMidYMid meet" style="image-rendering:pixelated"/></svg>
      <div class="buddy" style="width:${S*sc}px;height:${S*sc}px;left:${x}%;top:${top}%;transform:translateX(-50%)">${BUDDY}</div>
    </div>
    <div class="lab">${lab}</div>
  </div>`).join('');
</script></body></html>
