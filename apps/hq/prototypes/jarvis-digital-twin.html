:root{
  --accent:#2f7dff;--accent-rgb:47,125,255;--cyan:#27d7f2;--violet:#8b6cff;--amber:#f5ad3d;
  --green:#27c784;--red:#f15c72;--teal:#31bca5;--rose:#d969a9;

html[data-theme="light"]{
  --bg:#edf4fc;--bg2:#f8fbff;--panel:rgba(255,255,255,.76);--panel-solid:#fff;
  --text:#0c2548;--muted:#58708f;--faint:#8da1b8;--line:rgba(23,77,137,.14);

*{box-sizing:border-box}html,body,#root{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{color:inherit}.app{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;isolation:isolate}
.app:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle at 50% 45%,black,transparent 86%)}
.app:after{content:"";position:absolute;inset:-20%;pointer-events:none;background:radial-gradient(circle at 50% 42%,rgba(var(--accent-rgb),.13),transparent 34%),radial-gradient(circle at 8% 35%,rgba(39,215,242,.06),transparent 25%),radial-gradient(circle at 92% 68%,rgba(139,108,255,.07),transparent 26%)}
.boot{position:fixed;inset:0;z-index:500;display:grid;place-items:center;background:var(--bg)}
.boot-inner{text-align:center}.boot-mark{width:8px;height:8px;margin:0 auto 20px;background:var(--accent);border-radius:50%;box-shadow:0 0 30px var(--accent)}
.boot-title{font:600 13px var(--mono);letter-spacing:.34em}.boot-sub{margin-top:11px;color:var(--muted);font:10px var(--mono);letter-spacing:.18em}
.boot-skip{position:absolute;right:24px;top:22px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 12px;color:var(--muted);font-size:11px;cursor:pointer}
.desktop{position:relative;z-index:2;height:100%;display:grid;grid-template-columns:56px 1fr;grid-template-rows:54px 1fr 76px}
.top{grid-column:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px;border-bottom:1px solid var(--line)}
.brand{font:600 10px var(--mono);letter-spacing:.22em;color:var(--muted)}.brand b{color:var(--text)}
.phase{justify-self:center;display:flex;gap:8px;align-items:center;font:10px var(--mono);letter-spacing:.12em;color:var(--muted)}
.phase i{display:block;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.top-actions{justify-self:end;display:flex;gap:8px}.icon-btn{min-width:36px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--panel);backdrop-filter:var(--glass);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover,.icon-btn:focus-visible{color:var(--text);border-color:rgba(var(--accent-rgb),.55);outline:none}
.spine{grid-row:1/4;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;background:color-mix(in srgb,var(--bg2) 80%,transparent);backdrop-filter:blur(18px);padding:12px 8px;gap:8px;z-index:8}
.spine-logo{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;margin-bottom:8px;background:linear-gradient(145deg,var(--accent),#6f62ff);color:white;font-weight:800;box-shadow:0 0 22px rgba(var(--accent-rgb),.35)}
.spine-group{font:8px var(--mono);letter-spacing:.08em;color:var(--faint);writing-mode:vertical-rl;margin:5px 0 1px}

.spine button:hover,.spine button.on{background:rgba(var(--accent-rgb),.12);color:var(--accent)}
.spine button::after{content:attr(data-tip);position:absolute;left:47px;top:50%;transform:translateY(-50%) translateX(-4px);opacity:0;pointer-events:none;white-space:nowrap;background:var(--panel-solid);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--text);font:10px var(--mono);transition:.18s;box-shadow:var(--shadow)}
.spine button:hover::after,.spine button:focus-visible::after{opacity:1;transform:translateY(-50%)}
