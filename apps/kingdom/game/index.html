<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kingdom — Walkable Client</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0c12;
      color: #f4f6fb;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .frame {
      position: relative;
      border: 3px solid #2a3040;
      border-radius: 12px;
      box-shadow: 0 24px 70px rgba(0,0,0,.5);
      overflow: hidden;
    }
    canvas { display: block; image-rendering: pixelated; }
    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(10,12,20,.6);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      padding: 6px 12px;
      backdrop-filter: blur(6px);
      max-width: 420px;
    }
    .hud b { display: block; font-size: 13px; }
    .hud small { display: block; color: #9aa4bc; font-size: 11px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toast {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10,12,20,.78);
      border: 1px solid rgba(255,255,255,.14);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      opacity: 0;
      transition: opacity .25s ease;
      pointer-events: none;
    }
    .help { color: #9aa4bc; font-size: 13px; text-align: center; max-width: 660px; line-height: 1.5; }
    .help b { color: #f4f6fb; }
    .help a { color: #8ab4ff; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="frame">
    <canvas id="game"></canvas>
    <div class="hud"><b id="mapName">Loading…</b><small id="mapMeta"></small></div>
    <div id="toast" class="toast"></div>
  </div>
  <p class="help">
    <b>WASD / arrows</b> walk · <b>Backspace</b> previous map · yellow rectangles are exits —
    every map, exit and monster comes from the scraped data layer.
    Tune spawns in <a href="../command/index.html">Kingdom Command</a>.
  </p>
  <script src="sprites.js"></script>
  <script src="data.js"></script>
  <script src="engine.js"></script>
</body>
</html>
