/* wrapper: htm writes class= / for= — normalize to React 18 prop names */
function h(type,props){
  const children = Array.prototype.slice.call(arguments,2);
  if(props){
    if('class' in props){ props.className = props.class; delete props.class; }
    if('for' in props){ props.htmlFor = props.for; delete props.for; }
  }
  return React.createElement.apply(React,[type,props].concat(children));
}
const html = htm.bind(h);

/* ============================================================
   UNIFIED ICON SYSTEM — single source: Lucide (no emoji/glyphs)
   <Icon name="layout-dashboard" size=16/> ; agent orb is exempt.
   ============================================================ */
function _pascal(n){ return String(n).split(/[-_ ]/).filter(Boolean).map(s=>s[0].toUpperCase()+s.slice(1)).join(''); }
function _fixAttrs(a){ if(!a) return {}; const m={'stroke-width':'strokeWidth','stroke-linecap':'strokeLinecap','stroke-linejoin':'strokeLinejoin','fill-rule':'fillRule','clip-rule':'clipRule'}; const o={}; for(const k in a){ o[m[k]||k]=a[k]; } return o; }
function Icon({name,size=16,stroke=2,style,cls}){
  const lib = (window.lucide && (window.lucide.icons||window.lucide)) || {};
  const node = lib[_pascal(name)] || lib[name];
  const kids = Array.isArray(node) ? node : (node && node.default) ? node.default : null;
  if(!kids){ // graceful fallback dot
    return html`<svg width=${size} height=${size} viewBox="0 0 24 24" class=${'lic '+(cls||'')} style=${style}><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>`;
  }
  return html`<svg xmlns="http://www.w3.org/2000/svg" width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width=${stroke} stroke-linecap="round" stroke-linejoin="round" class=${'lic '+(cls||'')} style=${style}>
    ${kids.map((c,i)=>React.createElement(c[0], {..._fixAttrs(c[1]), key:i}))}</svg>`;
}

/* ============================================================
   OBSIDIAN-STYLE CANVAS — renders markdown (not raw) for every
   placeholder. Supports [[wikilinks]], callouts, tables, code.
   ============================================================ */
function mdToHtml(md){
  let src = String(md||'');
  // Obsidian wikilinks [[Note]] and [[Note|alias]]
  src = src.replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'<a class="wl">$2</a>').replace(/\[\[([^\]]+)\]\]/g,'<a class="wl">$1</a>');
  // Obsidian callouts > [!note] Title
  src = src.replace(/^> \[!(\w+)\]\s*(.*)$/gm,(m,k,t)=>`<div class="cal cal-${k.toLowerCase()}"><b>${t||k}</b></div>`);
  let out = (window.marked ? window.marked.parse(src, {breaks:true}) : src.replace(/\n/g,'<br/>'));
  return out;
}
function MdCanvas({md,frontmatter}){
  return html`<div class="obs fadein">
    ${frontmatter && html`<div class="obs-fm">
      ${Object.entries(frontmatter).map(([k,v])=>html`<div class="obs-fmrow" key=${k}><span class="fk">${k}</span><span class="fv">${v}</span></div>`)}
    </div>`}
    <div class="obs-body" dangerouslySetInnerHTML=${{__html: mdToHtml(md)}}></div>
    <div class="obs-tag"><${Icon} name="file-text" size=${11}/> markdown canvas · rendered placeholder · no build</div>
  </div>`;
}

> [!note] Canvas prompt (design only)
> A rig-by-time **Gantt / swimlane** view of the field drilling sequence, in the spirit of the NOC **IB27 DS Rev1 2026** schedule. This note is the design brief for the canvas — not a live build.

## Purpose
Give reservoir & well-delivery teams one picture of **which rig drills which well, when**, how the sequence **changed between revisions**, and the downstream impact on production ramp and RFD/RFSU milestones.

## Layout
- **Rows = rigs** (swimlanes): \`Ensco 110\`, \`Sapphire\`, \`Al Jassra\`, \`GDI Dukhan\`
- **Columns = time** with a zoomable axis and preset ranges: **24-Month View** and **5-Year View**
- **Bars = activities** placed by start/end date, labelled with well name + drain

## Activity types (color-coded)
| Type | Meaning | Color |
|---|---|---|
| \`DEV\` | Development well (OP / WI / WD) | green family |
| \`WO\` | Workover / re-drill | amber |
| \`APP\` | Appraisal | blue |
| \`RIG\` | Rig move · CP · cert · suspension | grey |

## Well & reservoir coding
- **Well type**: \`OP\` oil producer · \`WI\` water injector · \`GI\` gas injector · \`WD\` water disposal
- **Reservoir**: \`KB / KC\`, \`SH / FW\`, \`LK / UM\`, \`NU / UR\` — legend chip per bar
- **Maturation**: \`SOR0/1\`, \`SOR2\`, \`BOD\`, \`SH AWARE\`, \`NOC ONLY\`, \`Non-FID\`

## Milestones & overlays
- \`RFD\` / \`RFSU\` markers per project (e.g. **DC05/PA**, **DC06/QA**, **DC03/LA**, **DC04/MA**, **DC09/RA**)
- Phase bands: \`Phase 1\`, \`Gallaf Batch 1–3\`, \`Ruya\`, \`WO-RD-Infill\`, \`APP\`
- Vertical "today" line and year dividers

## Revision comparison (key ask)
> [!tip] What changed
> Overlay two schedule revisions and diff them: **IB26 → IB27 DS → IB27 DS Rev1**.
- Highlight **moved**, **added**, **removed**, **re-sequenced** wells

## Interactions
- Zoom / pan the timeline · toggle rigs · filter by reservoir, well type, phase

- Switch **24-month ↔ 5-year**; toggle **revision A/B diff**
- Export current view to the [[Report]] hub as a Drilling Sequence report

- Schedule table per rig (start / end / activity / well / days / type / reservoir)
- Well-count roll-ups by TD year
- Grounded in [[Al Shaheen]] · its own lifecycle stage · feeds [[Well Delivery]] and [[Reservoir Management]]

## States
- Loading · empty (no revision selected) · diff mode · single-revision mode
- Responsive: swimlanes stack and the axis compresses on tablet / mobile`;

   SUBSURFACE CORPORATE-DATA MAP — every placeholder is now an

   for detail later. High-level index across the 5 lifecycle stages

const PR_META = {P1:['#e11d74','extract first'],P2:['#f59e0b','extract next'],P3:['#64748b','later']};
/* class: standard = .md knowledge-base minimum-requirement doc · generated = Cosmo output (report/deck/word/dataset) */
const CLS_META = {standard:['book-marked','#0FB5A6','Knowledge Base'], generated:['sparkles','#7c3aed','Cosmo Generated']};
const GEN_TYPE_ICON = {Report:['file-text','#2563eb'],Presentation:['monitor-play','#d24726'],Word:['file-text','#2563eb'],Dataset:['database','#1e7145'],Dashboard:['layout-dashboard','#0a8a7f']};
function cnote(o){
  const src=(o.sources||[]).map(s=>`- ${s}`).join('\n');
  const con=(o.contains||[]).map(s=>`- ${s}`).join('\n');
  const ext=(o.extract||[]).map(s=>`- [ ] ${s}`).join('\n');
  const lnk=(o.links||[]).map(s=>`[[${s}]]`).join(' · ');
  const isStd=o.cls==='standard';
  const banner=isStd
    ? `> [!success] Knowledge-base standard · minimum-requirement source doc\n> ${o.purpose}`
    : `> [!note] Cosmo-generated ${o.fmt} · output artifact\n> ${o.purpose}`;
  return `---\ntype: ${isStd?'kb_standard':'cosmo_generated'}\nclass: ${o.cls}\nstage: ${o.stageLabel}\ntheme: ${o.theme}\nowner: ${o.by}\nformat: ${o.fmt}\nextract_priority: ${o.pr}\nstatus: ${o.status||'indexed'}\n---\n\n# ${o.title}\n\n${banner}\n\n## What it contains\n${con}\n\n## Source data\n${src}\n\n## ${isStd?'Extract for detail later':'Built from'}\n${ext}\n\n## Linked\n${lnk||'—'}`;
}

function aoHx(hex,a){ let h=hex.replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function AgentOrb({size=64}){
  const ref = useRef(null);
  useEffect(()=>{
    const host = ref.current; if(!host) return;
    const cv = document.createElement('canvas');
    const dpr = Math.min(2.5, window.devicePixelRatio||1);
    cv.width=size*dpr; cv.height=size*dpr; cv.style.width=size+'px'; cv.style.height=size+'px';
    cv.style.display='block'; cv.style.borderRadius='50%';
    host.insertBefore(cv, host.firstChild);
    const ctx = cv.getContext('2d');
    const AG = AGENTS.filter(a=>!a.center);
    const cx=size/2, cy=size/2, R=size/2;
    const orbitRx=R*0.80, orbitRy=R*0.30, tilt=-0.42;
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let t=0, raf=0, hover=0;
    const onEnter=()=>hover=1, onLeave=()=>hover=0;
    host.addEventListener('pointerenter',onEnter); host.addEventListener('pointerleave',onLeave);
    const conic = !!ctx.createConicGradient;
    function frame(){
      const r=host.getBoundingClientRect();
      if(r.width===0){ raf=requestAnimationFrame(frame); return; }
      const dark=document.documentElement.classList.contains('dark');
      if(!reduce) t+=0.016*(1+hover*0.7);
      ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,size,size);
      const bloom=R*(1.0+0.05*Math.sin(t*1.3));
      let bg=ctx.createRadialGradient(cx,cy,R*0.28,cx,cy,bloom);
      bg.addColorStop(0,aoHx('#0FB5A6',dark?0.42:0.28)); bg.addColorStop(0.45,aoHx('#2563eb',dark?0.20:0.13)); bg.addColorStop(1,'rgba(0,0,0,0)');

/* ============================================================
   DIGITAL EMPLOYEE UNIVERSE canvas — center + orbit, grouped by
   vertical (ported behaviour from APP_Master_Cosmo deDraw)
   ============================================================ */
function DEUniverse({sel,onSel}){
  const ref = useRef(null);
  useEffect(()=>{
    const cv=ref.current; if(!cv) return;
    const stage=cv.parentElement; const dpr=window.devicePixelRatio||1;
    let geo={nodes:[],cx:0,cy:0,R:0};
    function layout(w,h){
      const cx=w/2, cy=h*0.5, R=Math.min(w,h)*0.35;
      geo={cx,cy,R,nodes:[]};
      const center=AGENTS.find(a=>a.center);
      geo.nodes.push({a:center,x:cx,y:cy,r:Math.max(36,R*0.17)});
      const orbit=AGENTS.filter(a=>!a.center);
      orbit.forEach((a,i)=>{ const ang=-Math.PI/2 + i/orbit.length*Math.PI*2;
        geo.nodes.push({a,x:cx+R*Math.cos(ang),y:cy+R*Math.sin(ang),r:Math.max(26,R*0.11)}); });
    }
    function draw(){
      const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
      const w=cv.width/dpr,h=cv.height/dpr; ctx.clearRect(0,0,w,h);
      const cs=getComputedStyle(document.documentElement);
      const line=cs.getPropertyValue('--line').trim(), ink=cs.getPropertyValue('--ink').trim(), ink3=cs.getPropertyValue('--ink3').trim();
      const center=geo.nodes.find(n=>n.a.center);
      ctx.beginPath(); ctx.arc(geo.cx,geo.cy,geo.R,0,7); ctx.strokeStyle=line; ctx.lineWidth=1; ctx.setLineDash([4,5]); ctx.stroke(); ctx.setLineDash([]);
      geo.nodes.filter(n=>!n.a.center).forEach(n=>{ ctx.beginPath(); ctx.moveTo(center.x,center.y); ctx.lineTo(n.x,n.y);
        ctx.strokeStyle=(sel===n.a.id||!sel)?'rgba(15,181,166,.35)':'rgba(148,163,184,.16)'; ctx.lineWidth=sel===n.a.id?2:1; ctx.stroke(); });
      geo.nodes.forEach(n=>{ const a=n.a, is=sel===a.id, faded=sel&&!is&&!a.center;
        ctx.globalAlpha=faded?0.4:1;
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r+(a.center?8:5),0,7); ctx.fillStyle=a.c+'22'; ctx.fill();
        ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,7); ctx.fillStyle=a.c; ctx.fill();
        if(is){ ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.stroke(); }
        ctx.fillStyle='#fff'; ctx.font=`800 ${a.center?18:13}px Inter,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(a.center?'RC':monogram(a.name), n.x, n.y);
        ctx.beginPath(); ctx.arc(n.x+n.r*0.72,n.y-n.r*0.72,4.5,0,7); ctx.fillStyle=STATUS_C[a.status]||'#94a3b8'; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.fill(); ctx.stroke();
        ctx.fillStyle=ink; ctx.font=`600 ${a.center?13:11}px Inter,sans-serif`; ctx.fillText(a.name, n.x, n.y+n.r+14);
        ctx.fillStyle=ink3; ctx.font='9px "JetBrains Mono",monospace';
        if(!faded){ const rl=a.role.length>26?a.role.slice(0,25)+'…':a.role; ctx.fillText(rl, n.x, n.y+n.r+26); }
        ctx.globalAlpha=1;
      });
    }
    function resize(){ const w=stage.clientWidth,h=stage.clientHeight; cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px'; layout(w,h); draw(); }
    const ro=new ResizeObserver(resize); ro.observe(stage); resize();
    const click=(e)=>{ const rect=cv.getBoundingClientRect(); const mx=e.clientX-rect.left,my=e.clientY-rect.top;
      const n=geo.nodes.find(n=>Math.hypot(mx-n.x,my-n.y)<=n.r+4); if(n)onSel(n.a.id); };
    cv.addEventListener('click',click);
    return ()=>{ ro.disconnect(); cv.removeEventListener('click',click); };
  },[sel]);
  return html`<canvas id="deCanvas" ref=${ref}></canvas>`;
}

function tabSpecMd(v,tab){
  const x=(TAB_SPECS[v.id]||{})[tab];
  if(!x) return `# ${tab} · ${v.name}

> [!warning] Content gap
> No approved tab specification has been mapped yet.

## Required next step
- Assign source documents
- Confirm scientific method
- Define acceptance criteria`;
  const [title,purpose,contains,sources,flow,visual]=x;
  const bullets=a=>a.map(z=>`- ${z}`).join('\n');
  const steps=flow.map((z,i)=>`${i+1}. ${z}`).join('\n');
  return `# ${title}

> ${purpose}

## What the canvas must contain
${bullets(contains)}

## Grounding inputs
${bullets(sources)}

## Primary user flow
${steps}

## Visualization and interaction
${visual}

## Exit criteria

${(LIFECYCLE_TECH[v.id]||{}).libraries||''}

## GeaVision renderer lessons harvested
${(LIFECYCLE_TECH[v.id]||{}).geavision||''}

${TWIN_BRAIN_MD}`;
}

function buildOrgData(){
  const root={id:'root', kind:'root', name:'North Star', sub:'Al Shaheen · Subsurface Data Map', c:'#0FB5A6', icon:'sparkles', children:[]};
  ORG_STAGES.forEach(st=>{

    const stageNode={id:'st-'+st.id, kind:'stage', name:st.name, sub:docs.length+' documents', c:st.c, icon:st.icon, children:[]};
    [['standard','Knowledge Base','theme'],['generated','Cosmo Generated','fmt']].forEach(([cls,label,groupBy])=>{
      const set=docs.filter(f=>f.cls===cls); if(!set.length) return;
      const cm=CLS_META[cls];
      const clsNode={id:'cls-'+st.id+'-'+cls, kind:'cls', name:label, sub:set.length+(cls==='standard'?' standards':' outputs'), c:cm[1], icon:cm[0], children:[]};
      const groups={};
      set.forEach(f=>{ const g=f[groupBy]; (groups[g]=groups[g]||[]).push(f); });
      Object.entries(groups).forEach(([g,arr])=>{
        clsNode.children.push({id:'grp-'+st.id+'-'+cls+'-'+g, kind:'grp', name:g, sub:arr.length+(cls==='standard'?' notes':' files'), c:cm[1],

      stageNode.children.push(clsNode);

  return root;
}

  const raw = buildOrgData();
  // prune per collapsed set
  const prune=(n)=>{ const o={...n}; if(collapsed.has(n.id)){ o._kids=(n.children||[]).length; o.children=null; }
    else if(n.children){ o.children=n.children.map(prune); } return o; };
  const rootData=prune(raw);
  const hierarchy=d3.hierarchy(rootData);
  const layout=d3.tree().nodeSize([NODE_W+GAP_X, NODE_H+GAP_Y])
    .separation((a,b)=>a.parent===b.parent?1:1.25)(hierarchy);
  const nodes=layout.descendants(), links=layout.links();
  const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs), maxY=Math.max(...ys);
  const link=d3.linkVertical().x(d=>d.x).y(d=>d.y);
  // manual pan/zoom (guaranteed drag) — refs so listeners bind once
  const tfRef=useRef(tf); tfRef.current=tf;
  const extRef=useRef({minX,maxX,maxY}); extRef.current={minX,maxX,maxY};
  const clampK=k=>Math.max(0.12,Math.min(2,+k.toFixed(3)));
  function fit(){
    const el=wrapRef.current; if(!el) return;
    const w=el.clientWidth, h=el.clientHeight, M=90; const {minX,maxX,maxY}=extRef.current;
    const gw=(maxX-minX)+NODE_W+M*2, gh=maxY+NODE_H+M*2;
    const k=clampK(Math.min(1, Math.min(w/gw, h/gh)));
    setTf({ k, x:w/2-((minX+maxX)/2)*k, y:Math.max(M*k, h/2-(maxY/2)*k) });
  }
  function zoomBy(f){ const el=wrapRef.current; if(!el)return; const w=el.clientWidth,h=el.clientHeight;
    setTf(t=>{ const nk=clampK(t.k*f); const cx=w/2,cy=h/2; const r=nk/t.k;
      return {k:nk, x:cx-(cx-t.x)*r, y:cy-(cy-t.y)*r}; }); }
  useEffect(()=>{
    const el=wrapRef.current; if(!el) return; let drag=null;
    const onWheel=(e)=>{ e.preventDefault(); const r=el.getBoundingClientRect(); const mx=e.clientX-r.left,my=e.clientY-r.top;
      setTf(t=>{ const nk=clampK(t.k*(e.deltaY<0?1.08:0.926)); const kr=nk/t.k;
        return {k:nk, x:mx-(mx-t.x)*kr, y:my-(my-t.y)*kr}; }); };
    const onDown=(e)=>{ if(e.button!==0)return; const t=tfRef.current; drag={x:e.clientX,y:e.clientY,px:t.x,py:t.y,moved:false}; el.classList.add('grabbing'); };
    const onMove=(e)=>{ if(!drag)return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y, px=drag.px, py=drag.py; if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true; setTf(t=>({...t,x:px+dx,y:py+dy})); };
    const onUp=()=>{ if(drag){ el._moved=drag.moved; el.classList.remove('grabbing'); } drag=null; };
    el.addEventListener('wheel',onWheel,{passive:false});
    el.addEventListener('pointerdown',onDown);
    window.addEventListener('pointermove',onMove);
    window.addEventListener('pointerup',onUp);
    setTimeout(fit,60);
    const ro=new ResizeObserver(fit); ro.observe(el);
    return ()=>{ el.removeEventListener('wheel',onWheel); el.removeEventListener('pointerdown',onDown); window.removeEventListener('pointermove',onMove); window.removeEventListener('pointerup',onUp); ro.disconnect(); };
  },[]);
  const toggle=(id,hasKids)=>{ if(!hasKids)return; setCollapsed(s=>{const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n;}); };
  const expandAll=()=>setCollapsed(new Set());
  const collapseToStages=()=>{ const s=new Set(); raw.children.forEach(st=>s.add(st.id)); setCollapsed(s); };
  const nodeClick=(n)=>{ if(wrapRef.current&&wrapRef.current._moved){ wrapRef.current._moved=false; return; } // ignore click after a pan
    const d=n.data; if(d.kind==='doc'){ onOpen&&onOpen(d.doc); }
    else { const hasKids=(d.children&&d.children.length)||d._kids; toggle(d.id,hasKids); } };
  const vw=(maxX-minX)+NODE_W+120, vh=maxY+NODE_H+120;
  return html`<div class="org" ref=${wrapRef}>
    <div class="org-seg">
      <b onClick=${expandAll}>Expand all</b>
      <b onClick=${collapseToStages}>Collapse to stages</b>
    </div>
    <div class="org-ctrls">
      <div class="ocb" onClick=${()=>zoomBy(1.25)} title="Zoom in"><${Icon} name="plus" size=${16}/></div>
      <div class="ocb" onClick=${()=>zoomBy(0.8)} title="Zoom out"><${Icon} name="minus" size=${16}/></div>
      <div class="ocb" onClick=${fit} title="Fit"><${Icon} name="maximize" size=${15}/></div>
    </div>
    <svg>
      <g transform=${`translate(${tf.x},${tf.y}) scale(${tf.k})`}>
        ${links.map((l,i)=>html`<path key=${i} class="org-link" d=${link(l)}/>`)}
        ${nodes.map(n=>{ const d=n.data; const hasKids=(d.children&&d.children.length)||d._kids;
          const isCol=collapsed.has(d.id);
          return html`<g key=${d.id} transform=${`translate(${n.x-NODE_W/2},${n.y-NODE_H/2})`}>
            <foreignObject class="org-fo" width=${NODE_W} height=${NODE_H}>
              <div class=${'node-card '+d.kind+(isCol?' collapsed':'')} onClick=${()=>nodeClick(n)} title=${d.name}>
                <span class="edge" style=${{background:d.c}}></span>
                ${d.kind==='doc'
                  ? html`<span class="ndot" style=${{background:d.c}}></span>`
                  : html`<span class="nic" style=${{background:d.c}}><${Icon} name=${d.icon} size=${d.kind==='root'?16:14} stroke=${2.1}/></span>`}
                <span class="ntx"><span class="nnm">${d.name}</span><span class="nsub">${d.sub||''}</span></span>
                ${d.kind==='doc' && d.doc && html`<span class="ntag">${d.doc.pr}</span>`}
                ${hasKids && d.kind!=='root' && html`<span class="node-count">${isCol?('+'+(d._kids||(d.children&&d.children.length))):'−'}</span>`}
              </div>
            </foreignObject>
          </g>`;
        })}
      </g>
    </svg>
    <div class="org-legend">
      ${ORG_STAGES.map(s=>html`<span class="lg" key=${s.id}><i style=${{background:s.c}}></i>${s.name}</span>`)}
    </div>
    <div class="org-hint">scroll = zoom · drag = pan · click a node to expand · click a doc to open</div>
  </div>`;
}

/* Word-like page geometry (portrait inches → px at 96dpi baseline) */
const PAGE_SIZES = {
  A4:{w:8.27,h:11.69,label:'A4'}, Letter:{w:8.5,h:11,label:'Letter'}, Legal:{w:8.5,h:14,label:'Legal'},
  A3:{w:11.69,h:16.54,label:'A3'}, Tabloid:{w:11,h:17,label:'Tabloid'}, A5:{w:5.83,h:8.27,label:'A5'},
};
const MARGINS = {Normal:1,Narrow:0.5,Moderate:0.75,Wide:1.5};
const PAGE_TITLES = ['Geological Synthesis Report','Method & Data','Results & Recommendations','Appendix — Evidence Log'];
function ReportDocument(){
  const [page,setPage]=useState(1);
  const [size,setSize]=useState('A4');
  const [orient,setOrient]=useState('portrait');
  const [margin,setMargin]=useState('Normal');
  const [cols,setCols]=useState(1);
  const [zoom,setZoom]=useState(1);
  const [pan,setPan]=useState({x:40,y:24});
  const [pages,setPages]=useState([1,2,3]);
  const canvasRef=useRef(null), planeRef=useRef(null), dragRef=useRef(null);
  const PX=96; // base scale (transform handles zoom)
  const sz=PAGE_SIZES[size];
  const wIn = orient==='portrait'?sz.w:sz.h;
  const hIn = orient==='portrait'?sz.h:sz.w;
  const pad = MARGINS[margin]*PX;
  const pw = wIn*PX, ph = hIn*PX;
  const addPage=()=>{ setPages(p=>[...p,p.length+1]); };
  const delPage=()=>{ if(pages.length>1){ setPages(p=>p.slice(0,-1)); if(page>pages.length-1)setPage(pages.length-1);} };
  const dims = `${wIn}″ × ${hIn}″`;
  const clampZ=z=>Math.max(0.25,Math.min(2.5,+z.toFixed(2)));
  const panRef=useRef(pan); panRef.current=pan;
  const pwRef=useRef(pw); pwRef.current=pw;
  const fit=()=>{ const el=canvasRef.current; if(!el)return; const cw=el.clientWidth; const z=clampZ(Math.min(1,(cw-80)/pwRef.current)); setZoom(z); setPan({x:Math.max(20,(cw - pwRef.current*z)/2), y:24}); };
  // wheel zoom (cursor-anchored) + drag pan — listeners attached once
  useEffect(()=>{ const el=canvasRef.current; if(!el) return;
    const onWheel=(e)=>{ e.preventDefault();
      setZoom(z=>{ const nz=clampZ(z*(e.deltaY<0?1.08:0.926));
        const r=el.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top; const k=nz/z;
        const p=panRef.current; setPan({x:mx-(mx-p.x)*k, y:my-(my-p.y)*k});
        return nz; }); };
    const onDown=(e)=>{ if(e.button!==0)return; dragRef.current={x:e.clientX,y:e.clientY,px:panRef.current.x,py:panRef.current.y}; el.classList.add('grabbing'); };

    const onUp=()=>{ dragRef.current=null; el.classList.remove('grabbing'); };

    el.addEventListener('pointerdown',onDown);
    window.addEventListener('pointermove',onMove);
    window.addEventListener('pointerup',onUp);
    return ()=>{ el.removeEventListener('wheel',onWheel); el.removeEventListener('pointerdown',onDown); window.removeEventListener('pointermove',onMove); window.removeEventListener('pointerup',onUp); };
  },[]);

const SLIDE_SIZES = {
  '16:9':{r:16/9,label:'Widescreen 16:9'}, '4:3':{r:4/3,label:'Standard 4:3'},
  '16:10':{r:16/10,label:'16:10'}, 'A4':{r:1.414,label:'A4 paper'}, '1:1':{r:1,label:'Square 1:1'},
};
const LAYOUTS = ['Title','Title + Content','Two Content','Section','Comparison','Chart','Table','Picture','Blank'];
const THEMES = [['dark','Midnight'],['light','Paper'],['teal','Teal'],['violet','Violet']];

/* slide body renderer — shared by editor + present mode */
function slideBody(sl,H){
  const L=sl.layout;
  if(L==='Section') return html`<${React.Fragment}>
    <div class="kick">${sl.k}</div><h1 style=${{maxWidth:'90%'}}>${sl.t}</h1>
    <div style=${{width:'22%',height:4,background:'currentColor',opacity:.5,borderRadius:3,marginTop:'2%'}}></div>`;
  if(L==='Title') return html`<${React.Fragment}>
    <div class="kick">${sl.k}</div><h1>${sl.t}</h1><p>${sl.p}</p>`;
  if(L==='Two Content'||L==='Comparison') return html`<${React.Fragment}>
    <div class="kick">${sl.k}</div><h1 style=${{fontSize:'clamp(16px,2.4vw,26px)'}}>${sl.t}</h1>
    <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'4%',marginTop:'2%'}}>
      <div class="dl-ph" style=${{minHeight:H*0.34}}>${L==='Comparison'?'Option A':'content A'}</div>
      <div class="dl-ph" style=${{minHeight:H*0.34}}>${L==='Comparison'?'Option B':'content B'}</div></div>`;
  if(L==='Chart') return html`<${React.Fragment}>
    <div class="kick">${sl.k}</div><h1 style=${{fontSize:'clamp(16px,2.4vw,26px)'}}>${sl.t}</h1>
    <div class="chartph">${[42,66,54,80,48,72].map((v,x)=>html`<i key=${x} style=${{height:v+'%'}}></i>`)}</div>`;

    <table class="tableph" style=${{marginTop:'3%'}}>${[0,1,2,3].map(r=>html`<tr key=${r}>${[0,1,2].map(c=>html`<td key=${c}>${r===0?'Col '+(c+1):'—'}</td>`)}</tr>`)}</table>`;
  if(L==='Picture') return html`<${React.Fragment}>
    <div class="kick">${sl.k}</div><h1 style=${{fontSize:'clamp(16px,2.4vw,26px)'}}>${sl.t}</h1>
    <div class="dl-ph" style=${{marginTop:'2%',minHeight:H*0.42,fontSize:'clamp(18px,3vw,34px)'}}><${Icon} name="image" size=${34}/></div>`;
  if(L==='Blank') return html`<div class="dl-ph" style=${{position:'absolute',inset:'7%'}}>blank canvas</div>`;
  // Title + Content
  return html`<${React.Fragment}>
    <div class="kick">${sl.k}</div><h1 style=${{fontSize:'clamp(16px,2.4vw,26px)'}}>${sl.t}</h1>
    <p>${sl.p}</p><div class="dl-ph" style=${{marginTop:'2%',minHeight:H*0.3}}>content placeholder</div>`;
}
function ReportPresentation(){
  const INIT=[

    {k:'Lifecycle',t:'Four stages, one shell',p:'Exploration · Field Development · Well Delivery · Reservoir Management.',layout:'Title + Content',theme:'dark',trans:'Push',notes:'Walk the four lifecycle stages left to right.'},
    {k:'Agents',t:'Seven workstream agents',p:'Each embedded as a digital employee; Cosmonaut orchestrates across all.',layout:'Two Content',theme:'teal',trans:'Morph',notes:'Contrast the seven agents; Cosmonaut in the middle.'},
    {k:'Value',t:'~$3M potential per year',p:'Evidence-first, C1-Controlled, grounded to the unified model.',layout:'Chart',theme:'violet',trans:'Zoom',notes:'Land the value case. Reference the ledger.'},
  ];
  const [slides,setSlides]=useState(INIT);
  const [i,setI]=useState(0);

  const [showNotes,setShowNotes]=useState(false);

  const [present,setPresent]=useState(false);
  const [box,setBox]=useState({w:900,h:520});
  const stageRef=useRef(null);
  const s=slides[i]||slides[0];
  const ratio=SLIDE_SIZES[size].r;
  const par = orient==='portrait' ? 1/ratio : ratio;  // width/height presented
  // fit-to-screen: measure stage, fit slide with margin, then apply zoom
  useEffect(()=>{
    const el=stageRef.current; if(!el) return;
    const ro=new ResizeObserver(()=>setBox({w:el.clientWidth,h:el.clientHeight}));
    ro.observe(el); setBox({w:el.clientWidth,h:el.clientHeight});
    return ()=>ro.disconnect();
  },[]);
  const availW=Math.max(240,box.w-48), availH=Math.max(180,box.h-72);
  let w=Math.min(availW, availH*par); let h=w/par; w*=zoom; h*=zoom;
  const setField=(k,v)=>setSlides(arr=>arr.map((sl,idx)=>idx===i?{...sl,[k]:v}:sl));
  const addSlide=()=>{ setSlides(a=>[...a,{k:'New',t:'New slide',p:'Placeholder body.',layout:'Title + Content',theme:s.theme,trans:'Fade',notes:''}]); setI(slides.length); };
  const dupSlide=()=>{ setSlides(a=>{const c={...a[i]};return [...a.slice(0,i+1),c,...a.slice(i+1)];}); setI(i+1); };
  const delSlide=()=>{ if(slides.length>1){ setSlides(a=>a.filter((_,x)=>x!==i)); setI(Math.max(0,i-1)); } };
  const move=(dir)=>{ const j=i+dir; if(j<0||j>=slides.length)return; setSlides(a=>{const b=[...a];const t=b[i];b[i]=b[j];b[j]=t;return b;}); setI(j); };
  const go=(d)=>setI(x=>(x+d+slides.length)%slides.length);
  // present-mode keyboard
  useEffect(()=>{
    if(!present) return;
    const onKey=(e)=>{ if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1);} else if(e.key==='ArrowLeft'){go(-1);} else if(e.key==='Escape'){setPresent(false);} };
    window.addEventListener('keydown',onKey); return ()=>window.removeEventListener('keydown',onKey);
  },[present,slides.length]);
  const pW=Math.min(window.innerWidth*0.92, (window.innerHeight*0.82)*par), pH=pW/par;
  return html`<div class="deck-wrap">
    <div class="deck-rail">
      <div style=${{fontFamily:'var(--mono)',fontSize:8.5,letterSpacing:'.12em',color:'var(--ink3)',margin:'2px 2px 8px',fontWeight:600}}>SLIDES · ${slides.length}</div>
      ${slides.map((sl,idx)=>html`<div class=${'sthumb '+(i===idx?'on':'')} key=${idx} onClick=${()=>setI(idx)}
        style=${{aspectRatio:String(par),height:'auto',width:138}}>
        <div class="stk">${sl.k}</div><div class="stt">${sl.t}</div><div class="sn">${idx+1}</div></div>`)}
      <div style=${{display:'flex',gap:5,marginTop:4,flexWrap:'wrap'}}>

        <button class="wbtn" onClick=${dupSlide} title="Duplicate"><${Icon} name="copy" size=${13}/></button>
        <button class="wbtn" onClick=${delSlide} disabled=${slides.length<=1} title="Delete"><${Icon} name="trash-2" size=${13}/></button>
      </div>
      <div style=${{display:'flex',gap:5,marginTop:5}}>
        <button class="wbtn" style=${{flex:1}} onClick=${()=>move(-1)} disabled=${i<=0} title="Move up"><${Icon} name="chevron-up" size=${12}/> Up</button>
        <button class="wbtn" style=${{flex:1}} onClick=${()=>move(1)} disabled=${i>=slides.length-1} title="Move down"><${Icon} name="chevron-down" size=${12}/> Down</button>
      </div>
    </div>
    <div class="deck-main" style=${{padding:0}}>
      <div class="ribbon" style=${{margin:0,borderRadius:0,borderLeft:'none',borderRight:'none',borderTop:'none'}}>
        <div class="rgrp">
          <label class="rselect"><span class="lab">SIZE</span>
            <select value=${size} onChange=${e=>setSize(e.target.value)}>
              ${Object.entries(SLIDE_SIZES).map(([k,v])=>html`<option key=${k} value=${k}>${v.label}</option>`)}
            </select></label>
          <div class="rseg" title="Orientation">
            <b class=${orient==='landscape'?'on':''} onClick=${()=>setOrient('landscape')}>▭</b>
            <b class=${orient==='portrait'?'on':''} onClick=${()=>setOrient('portrait')}>▯</b>
          </div>
        </div>
        <div class="rgrp insrow">
          <span class="ins" onClick=${()=>setField('layout','Title + Content')}><${Icon} name="type" size=${12}/> Text</span>
          <span class="ins" onClick=${()=>setField('layout','Picture')}><${Icon} name="image" size=${12}/> Image</span>
          <span class="ins" onClick=${()=>setField('layout','Chart')}><${Icon} name="bar-chart-3" size=${12}/> Chart</span>
          <span class="ins" onClick=${()=>setField('layout','Table')}><${Icon} name="table" size=${12}/> Table</span>
          <span class="ins"><${Icon} name="shapes" size=${12}/> Shape</span>
        </div>
        <div class="rgrp">

            <select value=${s.layout} onChange=${e=>setField('layout',e.target.value)}>
              ${LAYOUTS.map(l=>html`<option key=${l} value=${l}>${l}</option>`)}
            </select></label>
          <label class="rselect"><span class="lab">THEME</span>

          <label class="rselect"><span class="lab">TRANSITION</span>
            <select value=${s.trans} onChange=${e=>setField('trans',e.target.value)}>
              ${TRANSITIONS.map(t=>html`<option key=${t} value=${t}>${t}</option>`)}
            </select></label>
        </div>
        <div class="rgrp">
          <button class=${'rbtn '+(showNotes?'p':'')} onClick=${()=>setShowNotes(!showNotes)} title="Speaker notes"><${Icon} name="notebook-pen" size=${13}/> Notes</button>
          <button class=${'rbtn '+(showFooter?'p':'')} onClick=${()=>setShowFooter(!showFooter)} title="Slide footer & number"><${Icon} name="hash" size=${13}/> Footer</button>
          <div class="rzoom"><button onClick=${()=>setZoom(z=>Math.max(0.4,+(z-0.1).toFixed(2)))}>−</button>
            <span class="zv">${Math.round(zoom*100)}%</span>
            <button onClick=${()=>setZoom(z=>Math.min(2,+(z+0.1).toFixed(2)))}>＋</button>
            <button onClick=${()=>setZoom(1)} title="Fit">⤢</button></div>
          <button class="rbtn" onClick=${()=>setPresent(true)}><${Icon} name="play" size=${13}/> Present</button>
          <button class="rbtn p"><${Icon} name="download" size=${13}/> Export</button>
        </div>
      </div>
      <div class="deck-stage" ref=${stageRef}>
        <div class=${'deck-slide theme-'+s.theme+' fadein'} key=${i+s.layout+s.theme} style=${{width:w,height:h}}>
          <div class="sbadge">${i+1} / ${slides.length}</div>
          ${s.theme!=='light' && html`<div class="orbmini"></div>`}
          <div class="deck-canvasarea">${slideBody(s,h)}</div>
          ${showFooter && html`<div class="footerbar"><span>RMO Cosmo · Al Shaheen · C1-Controlled</span><span>${i+1}</span></div>`}
        </div>
        <div class="deck-nav">
          <button class="nb" onClick=${()=>go(-1)}><${Icon} name="chevron-left" size=${16}/></button>
          <span class="nc">${i+1} / ${slides.length}</span>
          <button class="nb" onClick=${()=>go(1)}><${Icon} name="chevron-right" size=${16}/></button>
        </div>
      </div>
      ${showNotes && html`<div class="notes">
        <div class="nh">SPEAKER NOTES · slide ${i+1}</div>
        <textarea value=${s.notes||''} placeholder="Add speaker notes…" onChange=${e=>setField('notes',e.target.value)}></textarea>
      </div>`}
      <div class="statusbar">
        <span>Slide ${i+1} of ${slides.length}</span><span>${SLIDE_SIZES[size].label}</span>
        <span>${orient}</span><span>layout: ${s.layout}</span><span>transition: ${s.trans}</span>
        <span>theme: ${(THEMES.find(t=>t[0]===s.theme)||[])[1]}</span>
        <span class="sp"></span><span>${Math.round(zoom*100)}%</span>
      </div>
    </div>
    <div class=${'present '+(present?'on':'')}>
      <button class="pexit" onClick=${()=>setPresent(false)}><${Icon} name="x" size=${13}/> Exit (Esc)</button>
      <div class=${'pslide theme-'+s.theme} style=${{width:pW,height:pH}}>

  </div>`;

    <circle cx=${cx} cy=${cy} r="15" fill="var(--teal)"/>
    <circle cx=${cx} cy=${cy} r="22" fill="none" stroke="var(--teal)" stroke-opacity=".35" stroke-width="1.5"/>
    <text x=${cx} y=${cy+3} text-anchor="middle" font-size="9" font-weight="700" fill="#fff">NS</text>
  </svg>
  <div class="mini-legend">${stages.map(s=>html`<span key=${s.id}><i style=${{background:s.c}}></i>${s.name}</span>`)}</div>`;
}
function CosmoMiniChart(){
  const data=[['Exploration',42,'#22d3ee'],['Field Dev',88,'#0FB5A6'],['Well Del',63,'#f59e0b'],['Reservoir',95,'#7c3aed'],['Drilling',54,'#e11d74']];
  return html`<div>
    <div style=${{fontWeight:700,fontSize:12,marginBottom:2}}>Documents by lifecycle</div>
    <div style=${{fontFamily:'var(--mono)',fontSize:9,color:'var(--ink3)',marginBottom:6}}>live · rendered from the data map</div>
    <div class="mini-bars">${data.map(d=>html`<div class="b" key=${d[0]} style=${{height:d[1]+'%',background:'linear-gradient('+d[2]+','+d[2]+'88)'}} title=${d[0]}></div>`)}</div>
    <div class="mini-legend">${data.map(d=>html`<span key=${d[0]}><i style=${{background:d[2]}}></i>${d[0]}</span>`)}</div>
  </div>`;
}
function Cosmonaut({open,full,leftTab,setLeftTab,showLeft,showRight,mView,onClose,onToggleLeft,onToggleRight,onCloseRight,onToggleFull,onNew,onMobile}){
  const [thinkOpen,setThinkOpen]=useState(false);
  const [device,setDevice]=useState('full');   // full | ar169 | ar43 | tablet | mobile
  const [model,setModel]=useState('cosmo-core');   // selected model
  const [mopen,setMopen]=useState(false);          // model dropdown
  const [draft,setDraft]=useState('');
  const [artifact,setArtifact]=useState('note');   // note | tree | chart — live right-pane content
  const [artFull,setArtFull]=useState(false);      // 80%-screen artifact popup
  const renderArtifact=()=> artifact==='note'
    ? html`<${MdCanvas} md=${(FILES.find(f=>f.title&&f.title.includes('Field Development'))||FILES[0]).md}/>`
    : artifact==='tree' ? html`<${CosmoMiniTree}/>` : html`<${CosmoMiniChart}/>`;
  const cm = CC_MODEL_BY_ID(model)||{};
  const chips=['Production summary','Build a chart','Model as table','Screen opportunities'];
  const streamRef=useRef(null);
  const CANNED = `Here is the **Al Shaheen** lifecycle at a glance:\n\n- **Exploration** · BETA · GeaVision, GeaGuard\n- **Field Development** · LIVE · WellAion\n- **Well Delivery** · BETA · WellNova\n- **Reservoir Management** · LIVE · Prismo, WellWatch, WellNexus\n- **Drilling Sequence** · BETA\n\nOpen the artifact pane on the right to inspect the live data-map tree, a rendered knowledge-base note, or a production chart.`;
  const [msgs,setMsgs]=useState([
    {role:'assistant', text:"Welcome to **Cosmonaut** — the RMO Cosmo orchestrator for the **Al Shaheen** field. Ask me anything, or open the artifact pane to see live content.", done:true},
  ]);
  const streamAssistant=(full)=>{
    if(streamRef.current) clearInterval(streamRef.current);
    setMsgs(m=>[...m,{role:'assistant',text:'',done:false}]);
    let i=0;
    streamRef.current=setInterval(()=>{
      i+=Math.max(2,Math.round(full.length/90));
      setMsgs(m=>{ const c=[...m]; const last=c[c.length-1]; c[c.length-1]={...last,text:full.slice(0,i)}; return c; });
      if(i>=full.length){ clearInterval(streamRef.current); streamRef.current=null;
        setMsgs(m=>{ const c=[...m]; c[c.length-1]={...c[c.length-1],done:true}; return c; }); }
    },26);
  };
  const send=(text)=>{ const t=(text!=null?text:draft).trim(); if(!t)return;
    setMsgs(m=>[...m,{role:'user',text:t,done:true}]); setDraft('');
    setTimeout(()=>streamAssistant(CANNED),240); };
  useEffect(()=>()=>{ if(streamRef.current)clearInterval(streamRef.current); },[]);
  const leftBody = leftTab==='history' ? html`<div>
      ${CC_SESSIONS.map((s,i)=>html`<div class=${'cc-sess '+(i===0?'on':'')} key=${s.id}>
        <div class="st">${s.title}</div><div class="sm">${s.meta}</div></div>`)}
    </div>`
    : leftTab==='artifacts' ? html`<div>
      ${CC_ARTIFACTS.map(a=>html`<div class="cc-art" key=${a.id}><span class="ai"><${Icon} name=${a.icon} size=${12}/></span>${a.name}</div>`)}
    </div>`
    : html`<div class="cc-lib">${[1,2,3,4].map(n=>html`<div class="im" key=${n}><${Icon} name="image" size=${18}/></div>`)}</div>`;
  return html`<div class=${'cosmo-canvas '+(open?'open':'')+(full?' full':'')} id="cosmoCanvas">
    <div class="cc-top">
      <div class="g"><${AgentOrb} size=${26}/></div>
      <div><div class="tt">Cosmonaut</div><div class="sub">RMO Cosmo · orchestrator</div></div>
      <div class="sp"></div>
      <div class="cc-ic" title="History & artifacts" onClick=${onToggleLeft}><${Icon} name="panel-left" size=${15}/></div>
      <div class="cc-ic" title="New chat" onClick=${onNew}><${Icon} name="plus" size=${15}/></div>
      <div class="cc-ic" title="Artifact browser" onClick=${onToggleRight}><${Icon} name="panel-right" size=${15}/></div>
      <div class="cc-ic" id="ccFullBtn" title="Full canvas" onClick=${onToggleFull}><${Icon} name=${full?'minimize-2':'maximize-2'} size=${15}/></div>
      <div class="cc-ic" title="Close" onClick=${onClose}><${Icon} name="x" size=${15}/></div>
    </div>
    <div class=${'cc-body'+(showLeft?' show-left':'')+(showRight?' show-right':'')+(mView==='history'?' m-left':'')+(mView==='browser'?' m-right':'')} id="ccBody">
      <div class="cc-left">
        <div class="cc-left-tabs">
          ${[['history','History'],['artifacts','Artifacts'],['library','Library']].map(t=>html`
            <div class=${'lt '+(leftTab===t[0]?'on':'')} key=${t[0]} onClick=${()=>setLeftTab(t[0])}>${t[1]}</div>`)}
        </div>
        <div class="cc-left-body">${leftBody}</div>
      </div>
      <div class="cc-mid">
        <div class="cc-stream" ref=${el=>{ if(el) el.scrollTop=el.scrollHeight; }}>
          ${msgs.map((m,i)=>html`<div class=${'msg '+m.role} key=${i}>
            <div class="who" style=${m.role==='user'?{textAlign:'right'}:{}}>${m.role==='user'?'YOU':'COSMONAUT'}</div>
            <div class="bub">
              ${m.role==='assistant'
                ? (m.text ? html`<div dangerouslySetInnerHTML=${{__html: mdToHtml(m.text)+(m.done?'':'<span class=\"cc-caret\"></span>')}}></div>`
                          : html`<div class="cc-typing"><i></i><i></i><i></i></div>`)
                : m.text}
              ${m.role==='assistant' && m.done && i===msgs.length-1 && msgs.length>1
                ? html`<div class="art-chip" onClick=${()=>{ if(!showRight)onToggleRight(); }}><${Icon} name="panel-right" size=${12}/> Open artifact pane</div>` : ''}
            </div>
          </div>`)}
        </div>
        <div class="cc-composer">
          <div class="cc-shell">
            <textarea class="cc-input" rows="1" placeholder="Ask Cosmonaut…" value=${draft}
              onInput=${e=>{setDraft(e.target.value); e.target.style.height='auto'; e.target.style.height=Math.min(160,e.target.scrollHeight)+'px';}}
              onKeyDown=${e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); e.target.style.height='auto'; } }}></textarea>
            <div class="cc-tray">
              <button class="cc-tool" title="Attach"><${Icon} name="paperclip" size=${15}/></button>
              <button class="cc-tool" title="Tools"><${Icon} name="wrench" size=${15}/></button>
              <div class="cc-mwrap">
                <div class="cc-mdl" onClick=${()=>setMopen(!mopen)}>
                  <span class="dot" style=${{background:cm.tc}}></span>${cm.name}
                  <span class="cv">${cm.ctx}</span><${Icon} name="chevron-down" size=${13}/>
                </div>
                <div class=${'cc-menu '+(mopen?'on':'')}>
                  ${CC_MODELS.map(g=>html`<div key=${g.group}>
                    <div class="cc-mgrp"><i style=${{background:g.tc}}></i>${g.group}</div>
                    ${g.models.map(m=>html`<div class=${'cc-mrow '+(model===m.id?'on':'')+(m.locked?' locked':'')} key=${m.id}
                        onClick=${()=>{ if(!m.locked){setModel(m.id);} setMopen(false); }}>
                      <div style=${{flex:1,minWidth:0}}>
                        <div class="mnm">${m.name}${m.badge?html`<span class="cc-mbadge">${m.badge}</span>`:''}${m.locked?html`<span class="cc-mlock"><${Icon} name="lock" size=${9}/> C1</span>`:''}</div>
                        <div class="mds">${m.desc}</div>
                      </div>
                      <div class="mmeta">
                        <span class="cc-weight" title="Rate-limit weight">${[1,2,3].map(w=>html`<i key=${w} class=${w<=m.weight?'f':''}></i>`)}</span>
                        <span class="mctx">${m.ctx}</span>
                      </div>
                    </div>`)}
                  </div>`)}
                </div>
              </div>
              <button class="cc-send" disabled=${!draft.trim()} onClick=${()=>send()}><${Icon} name="arrow-up" size=${16}/></button>
            </div>
          </div>
          <div class="cc-usage">
            <span class="u"><${Icon} name="gauge" size=${11}/> Context <div class="cc-bar"><i style=${{width:'24%'}}></i></div> 24% of ${cm.ctx}</span>
            <span class="u"><${Icon} name="battery-medium" size=${11}/> Weekly <div class="cc-bar warn"><i style=${{width:'62%'}}></i></div> 62% · resets Mon</span>
            <span class="u" style=${{marginLeft:'auto'}}><${Icon} name="shield" size=${11}/> ${cm.tier} · C1-Controlled</span>
          </div>
          <div class="cc-chips">${chips.map(c=>html`<div class="cc-chip" key=${c} onClick=${()=>send(c)}>${c}</div>`)}</div>
        </div>
      </div>
      <div class="cc-right">
        <div class="cc-right-top">
          <div class="cc-dev">
            ${[['full','maximize','Full'],['ar169','monitor','16:9'],['ar43','tv','4:3'],['tablet','tablet','Tablet'],['mobile','smartphone','Phone']].map(d=>html`
              <b key=${d[0]} class=${device===d[0]?'on':''} onClick=${()=>setDevice(d[0])}><${Icon} name=${d[1]} size=${12}/> ${d[2]}</b>`)}
          </div>
          <div class="art-seg">
            ${[['tree','git-fork','Tree'],['note','file-text','Note'],['chart','bar-chart-3','Chart']].map(a=>html`
              <b key=${a[0]} class=${artifact===a[0]?'on':''} onClick=${()=>setArtifact(a[0])}><${Icon} name=${a[1]} size=${11}/> ${a[2]}</b>`)}
          </div>
          <div class="cc-ic" title="Expand to full screen" onClick=${()=>setArtFull(true)}><${Icon} name="expand" size=${14}/></div>
          <div class="cc-ic" title="Download"><${Icon} name="download" size=${14}/></div>
          <div class="cc-ic" title="Close preview" onClick=${onCloseRight}><${Icon} name="x" size=${14}/></div>
        </div>
        <div class="cc-art-preview">
          <div class=${'cc-frame '+device}>
            <div class="fbar"><i></i><i></i><i></i><span class="furl">${artifact==='tree'?'data-map.tree':artifact==='chart'?'field-production.chart':'fdp.md'} · ${DEV_LABEL[device]||device}</span></div>
            <div class="fbody">${renderArtifact()}</div>
          </div>
          <div class="cc-dev-tag">${DEV_LABEL[device]||device}</div>
        </div>
      </div>
      <div class="cc-scrim" onClick=${()=>onMobile('chat')}></div>
    </div>
    <div class=${'modal-scrim '+(artFull?'on':'')} onClick=${()=>setArtFull(false)}>
      <div class="art-modal" onClick=${e=>e.stopPropagation()}>
        <div class="art-modal-hd">
          <span class="am-title"><${Icon} name=${artifact==='tree'?'git-fork':artifact==='chart'?'bar-chart-3':'file-text'} size=${15}/> ${artifact==='tree'?'Data-map tree':artifact==='chart'?'Field production chart':'Knowledge-base note'}</span>
          <div class="art-seg" style=${{marginLeft:'12px'}}>
            ${[['tree','git-fork','Tree'],['note','file-text','Note'],['chart','bar-chart-3','Chart']].map(a=>html`
              <b key=${a[0]} class=${artifact===a[0]?'on':''} onClick=${()=>setArtifact(a[0])}><${Icon} name=${a[1]} size=${11}/> ${a[2]}</b>`)}
          </div>
          <button class="mx" style=${{marginLeft:'auto'}} onClick=${()=>setArtFull(false)}><${Icon} name="x" size=${15}/></button>
        </div>
        <div class="art-modal-body">${renderArtifact()}</div>
      </div>
    </div>
  </div>`;
}

function SettingsModal({open,onClose,dark,setDark}){
  const [designer,setDesigner]=useState(false);
  const [density,setDensity]=useState('comfortable');
  const [motion,setMotion]=useState(true);
  const closeAll=()=>{setDesigner(false);onClose();};
  return html`<${React.Fragment}>
    <div class=${'modal-scrim '+(open&&!designer?'on':'')} onClick=${onClose}>
      <div class="modal" onClick=${e=>e.stopPropagation()}>
        <div class="modal-hd"><div class="mi"><${Icon} name="settings" size=${18}/></div><div><h2>Settings</h2><div class="ms">workspace, appearance and design control</div></div><button class="mx" onClick=${onClose}><${Icon} name="x" size=${15}/></button></div>
        <div class="modal-body">
          <div class="set-sec">DESIGN SYSTEM</div>
          <div class="set-row" style=${{borderColor:'var(--teal)',background:'var(--teal-soft)'}}><span class="si"><${Icon} name="palette" size=${15}/></span><div><div class="st">Designer Studio</div><div class="sd">Themes, components, canvas spine and knowledge studio</div></div><button class="newbtn" onClick=${()=>setDesigner(true)}>Open Designer</button></div>
          <div class="set-sec">APPEARANCE</div>
          <div class="set-row"><span class="si"><${Icon} name=${dark?'moon':'sun'} size=${15}/></span><div><div class="st">Theme mode</div><div class="sd">Preserve explicit light / dark selection</div></div><div class="sc segsm"><b class=${!dark?'on':''} onClick=${()=>setDark(false)}>Light</b><b class=${dark?'on':''} onClick=${()=>setDark(true)}>Dark</b></div></div>
          <div class="set-row"><span class="si"><${Icon} name="rows-3" size=${15}/></span><div><div class="st">Density</div><div class="sd">Workspace spacing</div></div><div class="sc segsm">${['compact','comfortable'].map(d=>html`<b key=${d} class=${density===d?'on':''} onClick=${()=>setDensity(d)}>${d}</b>`)}</div></div>
          <div class="set-row"><span class="si"><${Icon} name="sparkles" size=${15}/></span><div><div class="st">Motion</div><div class="sd">Respect reduced-motion preference</div></div><button class=${'tgl '+(motion?'on':'')} onClick=${()=>setMotion(!motion)}></button></div>
          <div class="set-sec">FOUNDATION</div>
          <div class="set-row"><span class="si"><${Icon} name="shield" size=${15}/></span><div><div class="st">C1-controlled workspace</div><div class="sd">Permissions, routing and export controls require production services</div></div><span class="chip">GOVERNED</span></div>
        </div>
      </div>
    </div>
    ${designer&&html`<div class="designer-scrim"><div class="designer-modal"><div class="designer-head"><${Icon} name="palette" size=${17} style=${{color:'var(--teal)'}}/><div><b>COSMO Designer Studio</b><br/><span>embedded previous designer · 80% canvas</span></div><div class="sp"></div><button class="wbtn" onClick=${()=>setDesigner(false)}><${Icon} name="minimize-2" size=${13}/> Back to settings</button><button class="mx" onClick=${closeAll}><${Icon} name="x" size=${15}/></button></div><iframe class="designer-frame" srcDoc=${atob(DESIGNER_STUDIO_URL.substring(DESIGNER_STUDIO_URL.indexOf(',')+1))} title="COSMO Designer Studio" sandbox="allow-scripts allow-same-origin allow-downloads allow-modals"></iframe></div></div>`}
  </${React.Fragment}>`;
}

  verticals:{title:'Lifecycle', items:VERTICALS.map(v=>({id:v.id,label:v.name,icon:v.icon,hint:v.sub,zone:'vertical'}))},
  report:{title:'Report', items:REPORT_TABS.map(t=>({id:t,label:t,icon:REPORT_ICON[t],hint:'report · '+t.toLowerCase(),zone:'report'}))},
  intel:{title:'Intelligence', items:INTEL.map(i=>({id:i.id,label:i.label,icon:i.icon,hint:'intelligence',zone:'intel'})).concat([{id:'foundation',label:'Foundation',icon:'settings',hint:'platform · control plane',zone:'foundation'}])},
};

function App(){
  const [nav,setNav]=useState({zone:'cockpit',id:'cockpit'});
  const [tab,setTab]=useState('Overview');
  const [dark,setDark]=useState(false);
  const [settings,setSettings]=useState(false);
  // mobile shell state
  const [drawer,setDrawer]=useState(false);       // off-canvas sidebar
  const [sheet,setSheet]=useState(null);           // bottom sheet group id
  // cosmonaut state
  const [cc,setCc]=useState(false);
  const [ccFull,setCcFull]=useState(false);
  const [ccLeftTab,setCcLeftTab]=useState('history');
  const [ccShowLeft,setCcShowLeft]=useState(false);
  const [ccShowRight,setCcShowRight]=useState(false);
  const [ccMView,setCcMView]=useState('chat');     // mobile: chat | history | browser

  useEffect(()=>{ document.documentElement.classList.toggle('dark',dark); },[dark]);
  useEffect(()=>{ document.body.classList.toggle('drawer-open',drawer); },[drawer]);
  useEffect(()=>{ document.body.classList.toggle('sheet-open',!!sheet); },[sheet]);
  useEffect(()=>{ document.body.classList.toggle('cosmo-on',cc); },[cc]);

  const closeMobile=()=>{ setDrawer(false); setSheet(null); };
  const toggleSheet=(g)=>{ setDrawer(false); setSheet(s=>s===g?null:g); };   // tap same tab closes the sheet
  const openVertical=(id)=>{ setNav({zone:'vertical',id}); setTab('Overview'); closeMobile(); };
  const openIntel=(id)=>{ setNav({zone:'intel',id}); closeMobile(); };
  const openReport=(t)=>{ setNav({zone:'report',id:'report'}); setTab(t||'Manager'); closeMobile(); };
  const openCockpit=()=>{ setNav({zone:'cockpit',id:'cockpit'}); closeMobile(); };
  const openFoundation=()=>{ setNav({zone:'foundation',id:'foundation'}); closeMobile(); };

  // bottom-sheet item dispatch
  const sheetGo=(it)=>{ setSheet(null);
    if(it.zone==='vertical') openVertical(it.id);
    else if(it.zone==='report') openReport(it.id);
    else if(it.zone==='intel') openIntel(it.id);
    else if(it.zone==='foundation') openFoundation(); };

  // cosmonaut handlers (mirror master)
  const openCosmo=()=>{ setCc(true); if(window.innerWidth<=820) setCcMView('chat'); closeMobile(); };
  const openCosmoFull=()=>{ setCc(true); setCcFull(true); if(window.innerWidth<=820) setCcMView('chat'); closeMobile(); };
  const closeCosmo=()=>{ setCc(false); setCcFull(false); };
  const toggleFull=()=>{ const n=!ccFull; setCcFull(n); setCcShowLeft(n); setCcShowRight(n); };
  const toggleLeft=()=>{ if(window.innerWidth<=820){ setCcMView(ccMView==='history'?'chat':'history'); return; }
    const nl=!ccShowLeft; setCcShowLeft(nl); if(nl && !ccFull) setCcFull(true); };   // desktop: opening a drawer expands to full canvas
  const toggleRight=()=>{ if(window.innerWidth<=820){ setCcMView(ccMView==='browser'?'chat':'browser'); return; }
    const nr=!ccShowRight; setCcShowRight(nr); if(nr && !ccFull) setCcFull(true); };
  const closeRight=()=>{ if(window.innerWidth<=820){ setCcMView('chat'); return; } setCcShowRight(false); };   // dedicated close (fixes drawer not closing)

  const vObj = nav.zone==='vertical' ? VERTICALS.find(v=>v.id===nav.id) : null;
  const tabList = nav.zone==='vertical' ? vObj.tabs : null;   // Report sub-tabs live in the sidebar — no redundant top strip

  const crumbLabel = nav.zone==='cockpit'?'Cockpit'
    : nav.zone==='vertical'?vObj.name
    : nav.zone==='foundation'?'Foundation'
    : nav.zone==='report'?'Report'
    : (INTEL.find(i=>i.id===nav.id)||{}).label;

  // active bottom-nav tab
  // active bottom-nav tab: an OPEN sheet wins; otherwise derive from the current zone
  const mActive = sheet ? sheet
    : nav.zone==='cockpit'?'cockpit'
    : nav.zone==='vertical'?'verticals'
    : nav.zone==='report'?'report'
    : (nav.zone==='intel'||nav.zone==='foundation')?'intel':'';

  return html`<div class=${'app '+(drawer?'drawer':'')}>
    <aside class="sidebar">
      <div class="brand"><div class="mark"><${Icon} name="sparkles" size=${16}/></div><div><div class="bt">COSMO</div></div><div class="bs">AL SHAHEEN</div></div>
      <div class="nav">
        <div class="navlabel">COMMAND CENTER</div>
        <div class=${'navitem '+(nav.zone==='cockpit'?'active':'')} onClick=${openCockpit}>
          <span class="d"><${Icon} name="layout-dashboard" size=${15}/></span><span class="lbl">Cockpit</span></div>
        <div class=${'navitem '+(nav.zone==='foundation'?'active':'')} onClick=${openFoundation}>
          <span class="d"><${Icon} name="settings" size=${15}/></span><span class="lbl">Foundation</span></div>

        <div class="navlabel">LIFECYCLE</div>
        ${VERTICALS.map(v=>html`<div class=${'navitem '+(nav.zone==='vertical'&&nav.id===v.id?'active':'')} key=${v.id} onClick=${()=>openVertical(v.id)}>
          <span class="d" style=${nav.zone==='vertical'&&nav.id===v.id?{}:{color:v.color}}><${Icon} name=${v.icon} size=${15}/></span>
          <span class="lbl">${v.name}</span></div>`)}

        <div class="navlabel">INTELLIGENCE</div>
        ${INTEL.map(i=>html`<div class=${'navitem '+(nav.zone==='intel'&&nav.id===i.id?'active':'')} key=${i.id} onClick=${()=>openIntel(i.id)}>
          <span class="d"><${Icon} name=${i.icon} size=${15}/></span><span class="lbl">${i.label}</span></div>`)}

        <div class="navlabel">REPORT</div>
        ${REPORT_TABS.map(t=>html`<div class=${'navitem '+(nav.zone==='report'&&tab===t?'active':'')} key=${t} onClick=${()=>openReport(t)}>
          <span class="d"><${Icon} name=${REPORT_ICON[t]} size=${15}/></span><span class="lbl">${t}</span></div>`)}
      </div>
    </aside>

    <header class="topbar">
      <button class="mham" onClick=${()=>{setSheet(null);setDrawer(!drawer);}} aria-label="Menu"><${Icon} name="menu" size=${19}/></button>
      <div class="crumbs"><span>RMO COSMO</span><span class="sep">/</span>
        ${nav.zone==='vertical'?html`<span>Lifecycle</span><span class="sep">/</span>`:''}
        <span class="cur">${crumbLabel}</span>
        ${(nav.zone==='vertical'||nav.zone==='report')?html`<span class="sep">/</span><span>${tab}</span>`:''}
      </div>
      <div class="tr">
        <button class="ibtn" onClick=${()=>setDark(!dark)} title="Theme"><${Icon} name=${dark?'sun':'moon'} size=${15}/></button>
        <button class="ibtn" onClick=${()=>setSettings(true)} title="Settings"><${Icon} name="settings" size=${15}/></button>
        <div class="avatar">A</div>
      </div>
    </header>

    <main class="main">
      ${tabList && html`<div class="tabs">
        ${tabList.map(t=>html`<div class=${'tab '+(tab===t?'on':'')} key=${t} onClick=${()=>setTab(t)}>${t}</div>`)}
      </div>`}
      <div class=${'content '+((nav.zone==='vertical'&&tab!=='Overview')||nav.zone==='cockpit'||nav.zone==='report'||(nav.zone==='intel'&&(nav.id==='agents'||nav.id==='insights'||nav.id==='knowledge'||nav.id==='data'))?'noscroll':'')}>
        ${nav.zone==='cockpit' && html`<${Cockpit} go=${openVertical}/>`}
        ${nav.zone==='vertical' && html`<${VerticalView} v=${vObj} tab=${tab} key=${vObj.id+tab}/>`}
        ${nav.zone==='intel' && html`<${IntelView} id=${nav.id} key=${nav.id}/>`}
        ${nav.zone==='foundation' && html`<${Foundation}/>`}
        ${nav.zone==='report' && html`<${ReportView} tab=${tab} goTab=${setTab} key=${tab}/>`}
      </div>
    </main>

    <footer class="footer">
      <span class="fdot"></span><span>Concept shell · UI/UX only · placeholders everywhere</span>
      <span>env: local</span><span>data: Al Shaheen · unified (mock)</span>
      <span style=${{marginLeft:'auto'}}>theme: ${dark?'dark':'light'}</span>
    </footer>

    <${Cosmonaut} open=${cc} full=${ccFull} leftTab=${ccLeftTab} setLeftTab=${setCcLeftTab}
      showLeft=${ccShowLeft} showRight=${ccShowRight} mView=${ccMView}
      onClose=${closeCosmo} onToggleLeft=${toggleLeft} onToggleRight=${toggleRight} onCloseRight=${closeRight}
      onToggleFull=${toggleFull} onNew=${()=>setCcLeftTab('history')} onMobile=${setCcMView}/>

    <${SettingsModal} open=${settings} onClose=${()=>setSettings(false)} dark=${dark} setDark=${setDark}/>

    <div class=${'orb-host '+(cc?'hidden':'')} onClick=${openCosmo} title="Open Cosmonaut">
      <div class="orb-label">Ask <b>Cosmonaut</b></div>
      <${AgentOrb} size=${64}/>
    </div>

    <!-- ===== MOBILE UI (ported 1:1 from master) ===== -->
    <div class="mscrim" onClick=${closeMobile}></div>
    <div class="msheet" role="dialog" aria-label="section menu">
      <div class="msheet-grip"></div>
      <div class="msheet-title">${sheet?M_GROUPS[sheet].title:''}</div>
      <div class="msheet-items">
        ${sheet && M_GROUPS[sheet].items.map(it=>{
          const on = (it.zone==='vertical'&&nav.zone==='vertical'&&nav.id===it.id)
            || (it.zone==='report'&&nav.zone==='report'&&tab===it.id)
            || (it.zone==='intel'&&nav.zone==='intel'&&nav.id===it.id)
            || (it.zone==='foundation'&&nav.zone==='foundation');
          return html`<div class=${'msheet-item '+(on?'on':'')} key=${it.id} onClick=${()=>sheetGo(it)}>
            <span class="mi-ic"><${Icon} name=${it.icon} size=${16}/></span>
            <span><span class="mi-t">${it.label}</span><br/><span class="mi-s">${it.hint}</span></span></div>`;
        })}
      </div>
    </div>
    <nav class="mnav" aria-label="Primary">
      <button class=${'mtab '+(mActive==='cockpit'?'on':'')} onClick=${openCockpit}>
        <${Icon} name="layout-dashboard" size=${23} stroke=${1.7}/><span>Cockpit</span></button>
      <button class=${'mtab '+(mActive==='verticals'?'on':'')} onClick=${()=>toggleSheet('verticals')}>
        <${Icon} name="git-branch" size=${23} stroke=${1.7}/><span>Lifecycle</span></button>
      <button class="mtab mtab-orb" onClick=${openCosmoFull} aria-label="Cosmonaut">
        <${AgentOrb} size=${52}/>
        <span class="mtab-orb-lbl">Cosmonaut</span></button>
      <button class=${'mtab '+(mActive==='report'?'on':'')} onClick=${()=>toggleSheet('report')}>
        <${Icon} name="file-text" size=${23} stroke=${1.7}/><span>Report</span></button>
      <button class=${'mtab '+(mActive==='intel'?'on':'')} onClick=${()=>toggleSheet('intel')}>
        <${Icon} name="sparkles" size=${23} stroke=${1.7}/><span>Intelligence</span></button>
    </nav>
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
