<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>RMO Cosmo · Shell 22 · Designer Fixed + Industry Benchmarks</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&family=Georgia&display=swap" rel="stylesheet"/>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>
<!-- Unified icon system: Lucide (single source, MIT) -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<!-- Markdown → Obsidian-style rendering for canvas placeholders -->
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<!-- D3 for the interactive Data Map org chart (layout + zoom/pan) -->
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
/* ============================================================
   RMO COSMO · FOUR-VERTICAL SHELL — design tokens (ported from
   APP_Master_Cosmo) — UI/UX concept only · placeholders everywhere
   ============================================================ */
:root{
  --bg:#f5f7fa; --panel:#ffffff; --panel2:#fbfcfe; --panel3:#f1f5f9;
  --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
  --line:#e2e8f0; --line2:#eef2f6;
  --teal:#0FB5A6; --teal-soft:#e6f7f5; --teal-ink:#0a8a7f;
  --blue:#2563eb; --cyan:#22d3ee; --green:#10b981; --purple:#7c3aed;
  --amber:#f59e0b; --red:#ef4444; --violet:#b37df0; --orange:#e58d4b;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
  --shadow-lg:0 12px 40px rgba(15,23,42,.14);
  --mono:'JetBrains Mono','SF Mono','Consolas',monospace;
  --sans:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --sbw:236px;
}
html.dark{
  --bg:#070d18; --panel:#0f172a; --panel2:#111a2e; --panel3:#0c1526;
  --ink:#e2e8f0; --ink2:#94a3b8; --ink3:#64748b;
  --line:#1e293b; --line2:#172033; --teal-soft:#0b3a36;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.35);
  --shadow-lg:0 20px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--ink3)}
html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:var(--sbw) 1fr;grid-template-rows:54px 1fr 26px;height:100vh;transition:grid-template-columns .28s cubic-bezier(.4,0,.2,1)}

/* ============ SIDEBAR ============ */
.sidebar{grid-row:1/4;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:15px 16px 14px;border-bottom:1px solid var(--line)}
.brand .mark{width:30px;height:30px;border-radius:9px;background:radial-gradient(circle at 35% 30%,#5fe3cf,#0FB5A6 45%,#2563eb);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 14px rgba(15,181,166,.45);position:relative;overflow:hidden}
.brand .mark::after{content:'';position:absolute;inset:0;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.5),transparent 40%);animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand .bt{font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1}
.brand .bs{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--teal-ink);background:var(--teal-soft);padding:2px 6px;border-radius:5px;margin-left:auto;font-weight:600}
.nav{padding:8px 10px;flex:1}
.navlabel{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--ink3);padding:14px 8px 6px;font-weight:600}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink2);position:relative;transition:.14s;margin-bottom:2px}
.navitem:hover{background:var(--line2)}
.navitem.active{background:var(--teal-soft);color:var(--teal-ink);font-weight:600}
.navitem.active::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--teal)}
.navitem .d{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px;flex-shrink:0;background:var(--panel2);border:1px solid var(--line)}
.navitem.active .d{background:#fff;border-color:var(--teal);color:var(--teal-ink)}
html.dark .navitem.active .d{background:var(--panel)}
.navitem .lbl{font-size:12.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navitem .st{font-family:var(--mono);font-size:7px;letter-spacing:.06em;padding:2px 5px;border-radius:20px;font-weight:600}
.st-LIVE{background:rgba(16,185,129,.15);color:var(--green)}
.st-BETA{background:rgba(245,158,11,.16);color:var(--amber)}
.st-PLANNED{background:var(--line2);color:var(--ink3)}
.vdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sov{margin:8px 12px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.sov .h{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--ink3);margin-bottom:8px}
.sov .bar{display:flex;gap:5px}
.sov .t{flex:1;text-align:center;font-family:var(--mono);font-size:8.5px;font-weight:600;padding:5px 0;border-radius:7px;border:1px solid var(--line);color:var(--ink3);cursor:pointer;transition:.14s}
.sov .t.on{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 3px 10px rgba(15,181,166,.4)}

/* ============ TOPBAR ============ */
.topbar{display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);z-index:15}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3)}
.crumbs .cur{color:var(--ink);font-weight:700}
.crumbs .sep{opacity:.5}
.tr{margin-left:auto;display:flex;align-items:center;gap:10px}
.tbadge{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;font-weight:600;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.tbadge .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal)}
.ibtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:15px}
.ibtn:hover{border-color:var(--teal);color:var(--teal-ink)}
.newbtn{padding:7px 14px;border-radius:9px;border:none;background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;font-weight:600;font-size:12px;box-shadow:0 4px 14px rgba(15,181,166,.35)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}

/* ============ MAIN ============ */
.main{overflow:hidden;display:flex;flex-direction:column;min-height:0;position:relative}
.tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto;flex-shrink:0}
.tabs::-webkit-scrollbar{height:0}
.tab{padding:11px 13px;font-size:12px;color:var(--ink3);white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer;transition:.14s;font-weight:500}
.tab:hover{color:var(--ink2)}
.tab.on{color:var(--teal-ink);border-bottom-color:var(--teal);font-weight:600}
.content{flex:1;overflow:auto;min-height:0;padding:18px 22px}
.content.noscroll{overflow:hidden;padding:16px 18px}

/* page header */
.pagehd{display:flex;align-items:center;gap:13px;margin-bottom:14px}
.pagehd .pico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:18px;color:#fff;flex-shrink:0}
.pagehd h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.pagehd .tag{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:2px}

/* footer */
.footer{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 18px;background:var(--panel);border-top:1px solid var(--line);font-family:var(--mono);font-size:9px;color:var(--ink3)}
.footer .fdot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}

/* ============ CARDS / PLACEHOLDERS ============ */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.gauto{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:var(--shadow)}
.panel-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.panel-hd h3{margin:0;font-size:11px;font-family:var(--mono);letter-spacing:.06em;color:var(--ink);text-transform:uppercase}
.panel-hd .nat{margin-left:auto;font-family:var(--mono);font-size:8px;padding:2px 7px;border-radius:20px;letter-spacing:.05em}
.nat-meas{background:rgba(16,185,129,.14);color:var(--green)}
.nat-interp{background:rgba(37,99,235,.14);color:var(--blue)}
.nat-der{background:rgba(124,58,237,.15);color:var(--purple)}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.metric .edge{position:absolute;left:0;top:0;bottom:0;width:4px}
.metric .k{font-family:var(--mono);font-size:9px;color:var(--ink3);letter-spacing:.06em}
.metric .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.metric .s{font-size:10.5px;color:var(--ink2);margin-top:3px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;padding:3px 9px;border-radius:20px;background:var(--line2);color:var(--ink2);margin:2px 4px 2px 0}

/* placeholder shells */
.ph{border:1.5px dashed var(--line);border-radius:14px;background:
   repeating-linear-gradient(45deg,transparent,transparent 11px,var(--line2) 11px,var(--line2) 12px);
   display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink3);gap:8px;padding:26px}
.ph .pht{font-weight:700;font-size:13px;color:var(--ink2)}
.ph .phs{font-size:11px;max-width:380px;line-height:1.55}
.ph .phi{width:52px;height:52px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:24px;color:var(--teal-ink);box-shadow:var(--shadow)}

/* workspace: canvas + inspector */
.ws{display:grid;grid-template-columns:1fr 300px;gap:14px;height:100%;min-height:0}
.ws.no-insp{grid-template-columns:1fr}
.ws-canvas{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:
   radial-gradient(circle at 30% 20%,var(--panel2),var(--panel));box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
.ws-toolbar{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel)}
.ws-toolbar .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel2)}
.ws-toolbar .seg b{padding:5px 11px;font-family:var(--mono);font-size:10px;color:var(--ink2);cursor:pointer;font-weight:500}
.ws-toolbar .seg b.on{background:var(--teal);color:#fff}
.wbtn{padding:5px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);font-size:10.5px;color:var(--ink2)}
.wbtn:hover{border-color:var(--teal);color:var(--teal-ink)}
.ws-stage{flex:1;position:relative;overflow:hidden;min-height:0}
.ws-grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);background-size:34px 34px;opacity:.55}
.evbadge{position:absolute;top:12px;left:14px;font-family:var(--mono);font-size:8.5px;padding:4px 9px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);z-index:3}
.evbadge.mixed{color:var(--amber);border-color:var(--amber)}
.crs{position:absolute;bottom:12px;left:14px;font-family:var(--mono);font-size:8.5px;color:var(--ink3);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 9px;box-shadow:var(--shadow);z-index:3}
.scalebar{position:absolute;bottom:12px;right:14px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--mono);font-size:8px;color:var(--ink3)}
.scalebar .l{width:70px;height:5px;border:1px solid var(--ink3);border-top:none}
.insp{border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.insp-hd{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:8px}
.insp-body{flex:1;overflow-y:auto;padding:12px 14px}
.insp-h{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;margin:13px 0 6px}
.insp-h:first-child{margin-top:0}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:5px 0;border-bottom:1px dashed var(--line2)}
.kv .k{color:var(--ink3);font-family:var(--mono);font-size:9.5px}
.tree{font-size:11.5px}
.tree .tn{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:7px;color:var(--ink2);cursor:pointer}
.tree .tn:hover{background:var(--line2)}
.tree .tn.ind{padding-left:22px}
.tree .eye{margin-left:auto;font-size:11px;opacity:.6}

/* cockpit */
.cockpit{display:grid;grid-template-rows:auto auto 1fr;gap:14px;height:100%;min-height:0}
.ck-hero{position:relative;display:flex;align-items:center;gap:18px;border:1px solid var(--line);border-radius:18px;padding:20px 22px;overflow:hidden;box-shadow:var(--shadow);
   background:linear-gradient(120deg,var(--teal-soft),var(--panel) 60%)}
.ck-hero .aurora{position:absolute;inset:0;z-index:0;opacity:.85;pointer-events:none;
   background:radial-gradient(600px 200px at 12% 0%,rgba(15,181,166,.28),transparent 60%),
   radial-gradient(520px 220px at 80% 120%,rgba(37,99,235,.22),transparent 60%),
   radial-gradient(400px 200px at 55% -20%,rgba(124,58,237,.16),transparent 60%);
   animation:auroraShift 12s ease-in-out infinite alternate}
@keyframes auroraShift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(-20px,10px,0) scale(1.08)}}
.ck-hero>*{position:relative;z-index:1}
.ck-hero h1{margin:0;font-size:20px;font-weight:800}
.ck-hero p{margin:5px 0 0;font-size:12px;color:var(--ink2);max-width:560px;line-height:1.5}
.ck-hero .badges{margin-left:auto;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;font-weight:600;padding:5px 11px;border-radius:20px;border:1px solid var(--teal);color:var(--teal-ink);background:var(--teal-soft)}
.pill .pd{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.ck-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ck-main{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;min-height:0}
.lifelane{display:flex;flex-direction:column;gap:9px}
.lane{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer;transition:.15s}
.lane:hover{border-color:var(--teal);transform:translateX(3px)}
.lane .li{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;color:#fff;flex-shrink:0}
.lane .ln{font-weight:700;font-size:13px}
.lane .ls{font-family:var(--mono);font-size:9px;color:var(--ink3)}
.lane .prog{margin-left:auto;width:90px}
.lane .pbar{height:6px;border-radius:4px;background:var(--line2);overflow:hidden}
.lane .pbar i{display:block;height:100%;border-radius:4px}
.agrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--line2)}
.agrow .adot{width:9px;height:9px;border-radius:50%}
.agrow b{font-size:11.5px;min-width:78px}
.agrow .arole{font-size:10.5px;color:var(--ink3);flex:1}
.agrow .ast{font-family:var(--mono);font-size:8px;padding:2px 7px;border-radius:20px;background:var(--line2);color:var(--ink2)}

/* DE universe */
.de-wrap{display:grid;grid-template-columns:1fr 320px;gap:14px;height:100%;min-height:0}
.de-wrap.no-pp{grid-template-columns:1fr}
.de-stage{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);
   background:radial-gradient(circle at 50% 45%,var(--panel2),var(--panel))}
#deCanvas{position:absolute;inset:0;display:block;cursor:pointer}
.de-legend{position:absolute;bottom:12px;left:14px;z-index:4;display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 11px;box-shadow:var(--shadow);font-family:var(--mono);font-size:8.5px;color:var(--ink2);flex-wrap:wrap}
.de-legend .lg{display:flex;gap:5px;align-items:center}.de-legend i{width:8px;height:8px;border-radius:50%}
.de-top{position:absolute;top:12px;left:14px;z-index:4;font-family:var(--mono);font-size:9px;color:var(--ink3);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;box-shadow:var(--shadow)}
.pp{border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pp-empty{flex:1;display:grid;place-items:center;color:var(--ink3);font-size:12px;text-align:center;padding:26px}
.pp-hd{display:flex;gap:12px;align-items:center;padding:15px 16px;color:#fff}
.pp-medal{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:17px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5)}
.pp-hd .nm{font-weight:800;font-size:16px;line-height:1.1}
.pp-hd .jt{font-family:var(--mono);font-size:9px;opacity:.92;margin-top:3px}
.pp-body{flex:1;overflow-y:auto;padding:14px 16px}
.pp-h{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;margin:14px 0 6px}
.pp-h:first-child{margin-top:0}
.pp-agent{border:1px solid var(--teal);background:var(--teal-soft);border-radius:11px;padding:10px 12px}
.pp-agent .an{font-weight:700;font-size:12.5px;color:var(--teal-ink)}
.pp-agent .ad{font-size:10.5px;color:var(--ink2);margin-top:3px}
.pp-list{margin:0 0 4px 16px;font-size:11.5px;color:var(--ink2);padding:0}.pp-list li{margin-bottom:4px;line-height:1.5}

/* cosmonaut agent orb (fixed) */
.orb-host{position:fixed;bottom:34px;right:26px;width:64px;height:64px;z-index:200;cursor:pointer;display:grid;place-items:center;isolation:isolate}
.orb-host .orb-label{position:absolute;right:74px;top:50%;transform:translateY(-50%) translateX(8px);white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:16px;box-shadow:var(--shadow-lg);opacity:0;transition:.2s;pointer-events:none}
.orb-host .orb-label b{color:var(--teal-ink)}
.orb-host:hover .orb-label{opacity:1;transform:translateY(-50%) translateX(0)}
.orb-host:hover{transform:scale(1.07)}
.orb-host:active{transform:scale(.94)}

/* ===== COSMONAUT CANVAS · 3-pane (ported 1:1 from master) ===== */
.cosmo-canvas{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:94vw;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 40px rgba(15,23,42,.16);z-index:210;display:grid;grid-template-rows:48px 1fr;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
.cosmo-canvas.open{transform:translateX(0)}
.cosmo-canvas.full{width:100vw!important;max-width:100vw;border-left:none}
/* full mode: columns follow the show-left / show-right toggles (fixes can't-close + clipping) */
.cosmo-canvas.full .cc-body{grid-template-columns:0 1fr 0!important}
.cosmo-canvas.full .cc-body.show-left{grid-template-columns:260px 1fr 0!important}
.cosmo-canvas.full .cc-body.show-right{grid-template-columns:0 1fr minmax(380px,44%)!important}
.cosmo-canvas.full .cc-body.show-left.show-right{grid-template-columns:260px minmax(420px,1fr) minmax(380px,42%)!important}
.cosmo-canvas.full .cc-stream{padding:20px 24px 6px}
.cosmo-canvas.full .cc-stream>.msg{max-width:760px;margin-left:auto;margin-right:auto}
.cosmo-canvas.full .cc-composer>*{max-width:820px;margin-left:auto;margin-right:auto}
.cosmo-canvas.full .cc-body.show-right .cc-stream>.msg{max-width:640px}
/* responsive: on mid-size desktops shrink side panels so nothing gets squeezed */
@media (max-width:1200px){
  .cosmo-canvas.full .cc-body.show-left{grid-template-columns:210px 1fr 0!important}
  .cosmo-canvas.full .cc-body.show-right{grid-template-columns:0 1fr minmax(320px,40%)!important}
  .cosmo-canvas.full .cc-body.show-left.show-right{grid-template-columns:210px minmax(320px,1fr) minmax(320px,38%)!important}
  .cc-body.show-left{grid-template-columns:170px 1fr 0}
  .cc-body.show-left.show-right{grid-template-columns:150px 1fr 260px}
}
.cc-top{display:flex;align-items:center;gap:9px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.cc-top .g{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.cc-top .tt{font-weight:800;font-size:12.5px}
.cc-top .sub{font-family:var(--mono);font-size:8.5px;color:var(--ink3)}
.cc-top .sp{flex:1}
.cc-ic{width:28px;height:28px;border:1px solid var(--line);border-radius:7px;background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink2);font-size:13px}
.cc-ic:hover{border-color:var(--teal);color:var(--teal-ink)}
.cc-body{display:grid;grid-template-columns:0 1fr 0;min-height:0;position:relative;transition:grid-template-columns .2s}
.cc-body.show-left{grid-template-columns:190px 1fr 0}
.cc-body.show-right{grid-template-columns:0 1fr 300px}
.cc-body.show-left.show-right{grid-template-columns:170px 1fr 280px}
.cc-left{border-right:1px solid var(--line);background:var(--panel2);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cc-left-tabs{display:flex;border-bottom:1px solid var(--line)}
.cc-left-tabs .lt{flex:1;padding:7px 4px;text-align:center;font-size:10px;cursor:pointer;color:var(--ink2);font-family:var(--mono)}
.cc-left-tabs .lt.on{color:var(--teal-ink);border-bottom:2px solid var(--teal);font-weight:600}
.cc-left-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;min-width:0}
.cc-sess{padding:8px 9px;border-radius:8px;cursor:pointer;font-size:11px;color:var(--ink2);margin-bottom:5px;border:1px solid transparent}
.cc-sess:hover{background:var(--line2)}.cc-sess.on{background:var(--teal-soft);border-color:var(--teal);color:var(--teal-ink)}
.cc-sess .st{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-sess .sm{font-family:var(--mono);font-size:8.5px;color:var(--ink3);margin-top:2px}
.cc-art{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--panel);font-size:11px}
.cc-art:hover{border-color:var(--teal)}
.cc-art .ai{width:22px;height:22px;border-radius:6px;background:var(--teal-soft);display:grid;place-items:center;color:var(--teal-ink);font-size:11px;flex-shrink:0}
.cc-lib{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cc-lib .im{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:linear-gradient(135deg,var(--teal-soft),var(--panel2));display:grid;place-items:center;color:var(--teal-ink);font-size:18px}
.cc-mid{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
.cc-stream{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 14px 6px}
.msg{margin-bottom:14px;max-width:100%}
.msg .who{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--ink3);margin-bottom:4px}
.msg.user .bub{background:var(--teal-soft);border:1px solid var(--teal);border-radius:12px 12px 3px 12px;padding:9px 12px;color:var(--ink);font-size:12.5px;line-height:1.5;margin-left:36px}
.msg.assistant .bub{background:var(--panel);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:10px 13px;font-size:12.5px;line-height:1.55;box-shadow:var(--shadow)}
.msg .bub p{margin:0 0 8px}.msg .bub p:last-child{margin:0}
.msg .bub b{color:var(--teal-ink)}
.think{border:1px dashed var(--line);border-radius:9px;margin-bottom:8px;background:var(--panel2);overflow:hidden}
.think .th-hd{display:flex;align-items:center;gap:7px;padding:6px 10px;cursor:pointer;font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.think .th-hd .chev{transition:transform .2s}.think.open .th-hd .chev{transform:rotate(90deg)}
.think .th-body{max-height:0;overflow:hidden;transition:max-height .25s;font-size:11px;color:var(--ink2);line-height:1.5}
.think.open .th-body{max-height:600px;padding:0 12px 10px}
.think .th-body .step{padding:3px 0;border-bottom:1px dashed var(--line2)}
.art-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--teal);border-radius:9px;background:var(--teal-soft);color:var(--teal-ink);font-size:11px;cursor:pointer;margin-top:6px}
.art-chip:hover{background:var(--panel)}
.cc-composer{border-top:1px solid var(--line);background:var(--panel);padding:10px 12px;flex:0 0 auto}
/* unified input shell (ChatGPT/Claude-style: one rounded field with controls in the tray) */
.cc-shell{border:1px solid var(--line);border-radius:16px;background:var(--panel2);padding:8px 8px 8px 12px;transition:border-color .15s,box-shadow .15s}
.cc-shell:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.cc-input{width:100%;border:none;background:none;font-family:var(--sans);font-size:13px;color:var(--ink);resize:none;max-height:160px;line-height:1.5;padding:2px 0 6px;outline:none}
.cc-tray{display:flex;align-items:center;gap:6px}
.cc-tool{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;background:var(--panel);display:grid;place-items:center;color:var(--ink2);cursor:pointer;flex:0 0 auto}
.cc-tool:hover{border-color:var(--teal);color:var(--teal-ink)}
.cc-mdl{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);cursor:pointer;font-size:12px;font-weight:600}
.cc-mdl:hover{border-color:var(--teal)}
.cc-mdl .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.cc-mdl .cv{color:var(--ink3);font-size:10px;font-family:var(--mono)}
.cc-send{width:34px;height:34px;border:none;border-radius:10px;background:var(--teal);color:#fff;cursor:pointer;flex:0 0 auto;display:grid;place-items:center;margin-left:auto}
.cc-send:hover{background:var(--teal-ink)}
.cc-send:disabled{opacity:.4;cursor:not-allowed}
/* model dropdown */
.cc-mwrap{position:relative}
.cc-menu{position:absolute;bottom:calc(100% + 8px);left:0;width:320px;max-height:360px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:7px;z-index:40;opacity:0;pointer-events:none;transform:translateY(6px);transition:.16s}
.cc-menu.on{opacity:1;pointer-events:auto;transform:none}
.cc-mgrp{font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--ink3);display:flex;align-items:center;gap:6px;padding:9px 8px 4px;text-transform:uppercase}
.cc-mgrp i{width:7px;height:7px;border-radius:50%}
.cc-mrow{display:flex;align-items:flex-start;gap:9px;padding:8px 9px;border-radius:10px;cursor:pointer}
.cc-mrow:hover{background:var(--line2)}
.cc-mrow.on{background:var(--teal-soft)}
.cc-mrow.locked{opacity:.55}
.cc-mrow .mnm{font-weight:600;font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:6px}
.cc-mrow .mds{font-size:10.5px;color:var(--ink3);margin-top:1px;line-height:1.35}
.cc-mrow .mmeta{margin-left:auto;text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.cc-weight{display:inline-flex;gap:2px}
.cc-weight i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.cc-weight i.f{background:var(--teal)}
.cc-mrow .mctx{font-family:var(--mono);font-size:8px;color:var(--ink3)}
.cc-mbadge{font-family:var(--mono);font-size:7px;font-weight:700;padding:1px 5px;border-radius:6px;background:var(--teal);color:#fff}
.cc-mlock{font-family:var(--mono);font-size:7px;color:var(--amber)}
/* usage strip */
.cc-usage{display:flex;align-items:center;gap:12px;padding:8px 4px 2px;font-family:var(--mono);font-size:9px;color:var(--ink3)}
.cc-usage .u{display:flex;align-items:center;gap:6px}
.cc-bar{width:70px;height:5px;border-radius:3px;background:var(--line2);overflow:hidden}
.cc-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--teal),var(--blue))}
.cc-bar.warn i{background:linear-gradient(90deg,var(--amber),var(--red))}
.cc-chips{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.cc-chip{font-size:10px;padding:4px 10px;border:1px solid var(--line);border-radius:14px;color:var(--ink2);cursor:pointer;background:var(--panel2)}
.cc-chip:hover{border-color:var(--teal);color:var(--teal-ink)}
.cc-right{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.cc-right-top{display:flex;align-items:center;gap:6px;padding:6px 9px;border-bottom:1px solid var(--line);background:var(--panel2)}
.cc-crumb{flex:1;font-family:var(--mono);font-size:9.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 8px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.cc-right-empty{flex:1;display:grid;place-items:center;color:var(--ink3);font-size:11px;text-align:center;padding:20px}
.cc-art-preview{flex:1;overflow:auto;padding:18px;background:var(--panel3);display:flex;flex-direction:column;align-items:center;justify-content:center}
/* full mode only: the Full preset stretches to fill; aspect/tablet/phone stay centered */
.cosmo-canvas.full .cc-frame.full{flex:1 1 auto;align-self:stretch;min-height:0}
.cc-scrim{display:none}
.orb-host.hidden{opacity:0;pointer-events:none;transform:scale(.6)}
/* artifact device selector (Claude-Code-style preview modes) */
.cc-dev{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);margin-right:auto;flex-wrap:wrap}
.cc-dev b{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;font-size:10px;color:var(--ink2);cursor:pointer;border-right:1px solid var(--line2);font-family:var(--mono)}
.cc-dev b:last-child{border-right:none}
.cc-dev b.on{background:var(--teal);color:#fff}
.cc-frame{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;transition:width .25s,max-width .25s,height .25s;width:100%;position:relative;display:flex;flex-direction:column}
.cc-frame.tablet{width:768px;max-width:100%;height:min(96%,1000px)}
/* aspect-locked frames (desktop presets) */
.cc-frame.ar169{width:min(100%,940px);aspect-ratio:16/9;height:auto}
.cc-frame.ar43{width:min(100%,780px);aspect-ratio:4/3;height:auto}
.cc-frame.full{max-width:100%}
/* phone chrome for mobile mode */
.cc-frame.mobile{width:min(340px,92%);height:min(94%,720px);border-radius:34px;border:9px solid #0b1220;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.cc-frame.mobile .fbar{border-radius:0}
.cc-frame .fbar{height:26px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:5px;padding:0 10px;flex:0 0 auto}
.cc-frame .fbar i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.cc-frame .fbar .furl{margin-left:8px;font-family:var(--mono);font-size:8px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-frame .fbody{padding:14px;overflow:auto;flex:1;min-height:120px}
.cc-frame.mobile .fbody{padding:12px}
.cc-dev-tag{font-family:var(--mono);font-size:8.5px;color:var(--ink3);margin-top:8px}
/* chat streaming animation */
.cc-typing{display:inline-flex;gap:4px;align-items:center;padding:2px 0}
.cc-typing i{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:ccblink 1.2s infinite ease-in-out}
.cc-typing i:nth-child(2){animation-delay:.2s}.cc-typing i:nth-child(3){animation-delay:.4s}
@keyframes ccblink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.cc-caret{display:inline-block;width:7px;height:13px;background:var(--teal);margin-left:2px;vertical-align:-2px;animation:cccaret 1s step-end infinite;border-radius:1px}
@keyframes cccaret{50%{opacity:0}}
.msg{animation:msgin .28s ease}
@keyframes msgin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* live artifact viewers in the right pane */
.art-seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);margin-left:8px}
.art-seg b{padding:4px 9px;font-size:10px;color:var(--ink2);cursor:pointer;border-right:1px solid var(--line2);font-family:var(--mono);display:inline-flex;gap:4px;align-items:center}
.art-seg b:last-child{border-right:none}.art-seg b.on{background:var(--teal);color:#fff}
/* 80%-screen artifact popup */
.art-modal{width:80vw;height:80vh;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;transform:scale(.96);transition:transform .22s;z-index:320}
.modal-scrim.on .art-modal{transform:scale(1)}
.art-modal-hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.art-modal-hd .am-title{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.art-modal-body{flex:1;overflow:auto;padding:22px;background:var(--panel3)}
.mini-tree{width:100%;height:100%;display:block}
.mini-bars{display:flex;align-items:flex-end;gap:8px;height:180px;padding:10px 4px 0}
.mini-bars .b{flex:1;border-radius:5px 5px 0 0;background:linear-gradient(var(--teal),var(--blue));animation:barsgrow .6s ease both}
@keyframes barsgrow{from{transform:scaleY(.15);opacity:.4}to{transform:scaleY(1);opacity:1}}
.mini-bars .b{transform-origin:bottom}
.mini-legend{display:flex;gap:14px;font-family:var(--mono);font-size:9px;color:var(--ink3);margin-top:8px;flex-wrap:wrap}
.mini-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.prpill{font-family:var(--mono);font-size:7.5px;font-weight:700;padding:1px 6px;border-radius:10px;border:1px solid;background:transparent}
/* ============ DATA MAP · interactive org chart ============ */
.org{position:relative;flex:1;width:100%;min-width:0;height:100%;min-height:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:radial-gradient(circle at 1px 1px,var(--line2) 1px,transparent 0) 0 0/22px 22px, var(--panel3)}
.org svg{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.org.grabbing,.org.grabbing svg{cursor:grabbing}
.org.grabbing .node-card{cursor:grabbing}
.org-link{fill:none;stroke:var(--line);stroke-width:1.5px}
.org-fo{overflow:visible}
.node-card{box-sizing:border-box;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);
  padding:8px 12px 8px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s;height:100%;position:relative;overflow:hidden}
.node-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px);border-color:var(--teal)}
.node-card .edge{position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:12px 0 0 12px}
.node-card .nic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:0 0 auto;box-shadow:0 2px 6px rgba(15,23,42,.16)}
.node-card .nic .lic{width:14px;height:14px}
.node-card.root .nic{width:30px;height:30px;border-radius:9px}
.node-card .ntx{min-width:0;flex:1;overflow:hidden}
.node-card .nnm{display:block;font-weight:700;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.node-card .nsub{display:block;font-family:var(--mono);font-size:8px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.node-card .ntag{font-family:var(--mono);font-size:7px;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;flex:0 0 auto}
.node-card .ndot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.node-card.root{background:linear-gradient(135deg,var(--teal-soft),var(--panel));border-color:var(--teal)}
.node-card.root .nnm{font-size:14px}
.node-card.stage{border-width:1.5px}
.node-card.collapsed{border-style:dashed}
/* count badge sits INSIDE the card (card is overflow:hidden so it never clips oddly) */
.node-count{position:absolute;top:5px;right:6px;min-width:16px;height:16px;border-radius:9px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:8px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.org-ctrls{position:absolute;top:12px;right:12px;z-index:6;display:flex;flex-direction:column;gap:6px}
.org-ctrls .ocb{width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--panel);display:grid;place-items:center;color:var(--ink2);box-shadow:var(--shadow);cursor:pointer}
.org-ctrls .ocb:hover{border-color:var(--teal);color:var(--teal-ink)}
.org-legend{position:absolute;bottom:12px;left:12px;z-index:6;display:flex;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 11px;box-shadow:var(--shadow);font-family:var(--mono);font-size:8.5px;color:var(--ink2)}
.org-legend .lg{display:flex;gap:5px;align-items:center}.org-legend i{width:8px;height:8px;border-radius:50%}
.org-hint{position:absolute;bottom:12px;right:12px;z-index:6;font-family:var(--mono);font-size:8.5px;color:var(--ink3);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;box-shadow:var(--shadow)}
.org-seg{position:absolute;top:12px;left:12px;z-index:6;display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.org-seg b{padding:6px 11px;font-size:11px;color:var(--ink2);cursor:pointer;border-right:1px solid var(--line2);font-family:var(--sans)}
.org-seg b:last-child{border-right:none}.org-seg b.on{background:var(--teal);color:#fff}
.fmt-tag{font-family:var(--mono);font-size:8px;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:6px}
.dc-clshd{display:flex;align-items:center;gap:9px;font-weight:800;font-size:13px;color:var(--ink);margin:18px 2px 4px}
.dc-clshd:first-child{margin-top:4px}
.dc-clshd .ci{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff}
.dc-clshd .dc-clsn{font-family:var(--mono);font-size:9px;color:var(--ink3);background:var(--line2);border-radius:10px;padding:1px 8px}

/* ============ REPORT · Word-like document ============ */
.doc-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;height:100%;min-height:0}
.doc-rail{overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:10px}
.pthumb{position:relative;width:120px;height:168px;margin:0 auto 12px;border:2px solid var(--line);border-radius:5px;background:#fff;cursor:pointer;box-shadow:var(--shadow);overflow:hidden;padding:9px 10px}
.pthumb:hover{border-color:var(--teal-ink)}
.pthumb.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-soft)}
.pthumb .tl{height:6px;border-radius:3px;background:#dfe6ef;margin:3px 0}
.pthumb .tl.t{background:var(--teal);width:60%;height:7px;margin-bottom:7px}
.pthumb .pn{position:absolute;bottom:3px;right:5px;font-family:var(--mono);font-size:8px;color:#334155;background:rgba(255,255,255,.85);padding:1px 6px;border-radius:6px}
.doc-main{overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.doc-main::-webkit-scrollbar{width:8px}
.ribbon{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:16px;flex-wrap:wrap;position:sticky;top:0;z-index:3}
.rgrp{display:flex;gap:4px;padding-right:9px;border-right:1px solid var(--line2);align-items:center}
.rgrp:last-child{border-right:none;margin-left:auto}
.rbtn{min-width:30px;height:30px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:12px;color:var(--ink2);display:inline-flex;align-items:center;gap:5px;font-family:var(--sans)}
.rbtn:hover{border-color:var(--teal);color:var(--teal-ink)}
.rbtn.p{background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;border:none}
.doc-sheet{background:#fff;color:#1a1a1a;width:740px;max-width:100%;margin:0 auto 24px;padding:54px 62px;box-shadow:var(--shadow-lg);border:1px solid var(--line);font-family:'Georgia',serif;line-height:1.7}
.doc-sheet .ban{border-bottom:3px solid var(--teal);padding-bottom:10px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end}
.doc-sheet .ban .co{font-family:'Inter',sans-serif;font-size:9px;letter-spacing:.16em;color:#0a8a7f;font-weight:800;text-transform:uppercase}
.doc-sheet .ban .dt{font-family:'Inter',sans-serif;font-size:9px;color:#94a3b8}
.doc-sheet h1{font-size:25px;margin:0 0 4px;font-family:'Georgia',serif}
.doc-sheet .sub{font-family:'Inter',sans-serif;font-size:11px;color:#64748b;margin-bottom:18px}
.doc-sheet h2{font-size:16px;margin:22px 0 8px;font-family:'Inter',sans-serif;color:#0f172a}
.doc-sheet p{font-size:12.5px;margin:0 0 10px;color:#334155}
.sk{height:10px;border-radius:4px;background:#eef1f5;margin:8px 0}
.sk.s60{width:60%}.sk.s80{width:80%}.sk.s90{width:90%}.sk.s45{width:45%}
/* ============ REPORT · PowerPoint-like deck ============ */
.deck-wrap{display:grid;grid-template-columns:160px 1fr;gap:16px;height:100%;min-height:0}
.deck-rail{overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:10px}
.sthumb{position:relative;width:138px;height:78px;margin:0 auto 10px;border:2px solid var(--line);border-radius:7px;cursor:pointer;overflow:hidden;background:linear-gradient(135deg,#0b1f3a,#0e2740);color:#fff;padding:9px 10px}
.sthumb:hover{border-color:var(--teal-ink)}
.sthumb.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-soft)}
.sthumb .stt{font-size:8px;font-weight:700;line-height:1.2}
.sthumb .stk{font-family:var(--mono);font-size:6px;color:#5fe3cf;letter-spacing:.1em;margin-bottom:3px}
.sthumb .sn{position:absolute;bottom:3px;left:5px;font-family:var(--mono);font-size:7.5px;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px}
.deck-main{display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.slide{aspect-ratio:16/9;width:100%;max-width:840px;margin:0 auto;border-radius:16px;border:1px solid var(--line);background:radial-gradient(700px 320px at 20% 0%,#0e3346,#071b2f 60%);color:#fff;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:6% 7%}
.slide .kick{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:#5fe3cf;text-transform:uppercase}
.slide h1{font-size:clamp(22px,3.4vw,36px);margin:10px 0 12px;font-weight:800;line-height:1.1}
.slide p{font-size:clamp(12px,1.5vw,15px);color:#bfe;max-width:72%;line-height:1.55;margin:0}
.slide .sbadge{position:absolute;top:22px;right:26px;font-family:var(--mono);font-size:9px;padding:4px 11px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3)}
.slide .orbmini{position:absolute;bottom:22px;right:26px;width:44px;height:44px;border-radius:50%;background:conic-gradient(from 0deg,#0FB5A6,#22d3ee,#2563eb,#7c3aed,#0FB5A6);filter:blur(1px);opacity:.85;animation:spin 6s linear infinite}
/* ============ REPORT · registry / manager ============ */
.rtable{width:100%;border-collapse:collapse;font-size:11.5px}
.rtable th{text-align:left;font-family:var(--mono);font-size:8.5px;color:var(--ink3);padding:8px 10px;letter-spacing:.05em;border-bottom:1px solid var(--line);text-transform:uppercase}
.rtable td{padding:8px 10px;border-bottom:1px dashed var(--line2);color:var(--ink2)}
.rtable tr:hover td{background:var(--line2)}
.tpill{font-family:var(--mono);font-size:8px;padding:2px 8px;border-radius:20px;font-weight:600}
.classcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.classcard:hover{border-color:var(--teal);transform:translateY(-2px)}
.classcard .ci{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;color:#fff;margin-bottom:10px}
.classcard .cn{font-weight:700;font-size:13px}
.classcard .cc{font-size:11px;color:var(--ink3);margin-top:2px}
.classcard .cv{font-size:22px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
/* ============ REPORT · daily reporting ============ */
.daily-wrap{display:grid;grid-template-columns:230px 1fr;gap:16px;height:100%;min-height:0}
.daily-rail{overflow-y:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:10px;display:flex;flex-direction:column;gap:8px}
.dayitem{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--panel);cursor:pointer;transition:.14s}
.dayitem:hover{border-color:var(--teal)}
.dayitem.on{border-color:var(--teal);background:var(--teal-soft)}
.dayitem .dd{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:11px;background:var(--panel2);border:1px solid var(--line);flex-shrink:0;text-align:center;line-height:1}
.dayitem.on .dd{background:#fff;border-color:var(--teal);color:var(--teal-ink)}
.dayitem .dn{font-weight:700;font-size:12px}
.dayitem .ds{font-family:var(--mono);font-size:8.5px;color:var(--ink3)}
.dayitem .dbadge{margin-left:auto;font-family:var(--mono);font-size:7.5px;padding:2px 6px;border-radius:20px}
.daily-main{overflow-y:auto;min-height:0}
.brief{border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.brief-hd{display:flex;align-items:center;gap:14px;padding:18px 20px;background:linear-gradient(120deg,var(--teal-soft),var(--panel) 70%);border-bottom:1px solid var(--line)}
.brief-hd .bi{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--blue));color:#fff;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.brief-hd h2{margin:0;font-size:17px;font-weight:800}
.brief-hd .bs{font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-top:3px}
.brief-body{padding:18px 20px}
.exrow{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line2)}
.exrow .ed{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.exrow .en{font-weight:700;font-size:12.5px}
.exrow .et{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.5}
.exrow .etag{margin-left:auto;font-family:var(--mono);font-size:8px;padding:2px 8px;border-radius:20px;flex-shrink:0}
/* ============ LUCIDE icon sizing / alignment ============ */
.lic{display:inline-block;vertical-align:middle;flex:0 0 auto}
.navitem .d .lic,.dc-fold .fi .lic{display:block}
/* ============ OBSIDIAN canvas (rendered markdown placeholder) ============ */
.obs{max-width:860px;margin:0 auto;padding:26px 30px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);line-height:1.7}
.obs-fm{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px 14px;margin-bottom:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 18px}
.obs-fmrow{display:flex;gap:8px;font-family:var(--mono);font-size:10px}
.obs-fmrow .fk{color:var(--ink3);min-width:74px}
.obs-fmrow .fv{color:var(--teal-ink);font-weight:600}
.obs-body h1{font-size:24px;font-weight:800;letter-spacing:-.01em;margin:6px 0 12px}
.obs-body h2{font-size:16px;font-weight:700;color:var(--teal-ink);margin:22px 0 8px;border-bottom:1px solid var(--line2);padding-bottom:5px}
.obs-body h3{font-size:13px;font-weight:700;margin:16px 0 5px}
.obs-body p{font-size:13px;color:var(--ink2);margin:0 0 11px}
.obs-body ul,.obs-body ol{margin:0 0 12px 20px;font-size:13px;color:var(--ink2)}
.obs-body li{margin-bottom:5px;line-height:1.6}
.obs-body code{font-family:var(--mono);font-size:11.5px;background:var(--line2);padding:1px 6px;border-radius:5px;color:var(--teal-ink)}
.obs-body pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:0 0 12px}
.obs-body pre code{background:none;padding:0;color:var(--ink2);font-size:11.5px;line-height:1.6}
.obs-body table{border-collapse:collapse;width:100%;font-size:12px;margin:0 0 14px}
.obs-body th{background:var(--teal-soft);color:var(--teal-ink);text-align:left;padding:6px 9px;border:1px solid var(--line);font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em}
.obs-body td{padding:6px 9px;border:1px solid var(--line2);color:var(--ink2)}
.obs-body blockquote{border-left:3px solid var(--teal);background:var(--teal-soft);margin:0 0 12px;padding:9px 14px;border-radius:0 9px 9px 0;font-size:12.5px;color:var(--ink2)}
.obs-body hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.obs-body a.wl{color:var(--teal-ink);cursor:pointer;border-bottom:1px solid var(--teal-soft);font-weight:600;text-decoration:none}
.obs-body a.wl:hover{background:var(--teal-soft);border-radius:3px}
.obs-body .cal{border-left:3px solid var(--blue);background:rgba(37,99,235,.08);padding:8px 13px;border-radius:0 9px 9px 0;margin:0 0 12px;font-size:12.5px}
.obs-body .cal-warning,.obs-body .cal-caution{border-left-color:var(--amber);background:rgba(245,158,11,.1)}
.obs-body .cal-tip,.obs-body .cal-success{border-left-color:var(--green);background:rgba(16,185,129,.1)}
.obs-body img{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.obs-tag{margin-top:18px;padding-top:12px;border-top:1px dashed var(--line2);font-family:var(--mono);font-size:9px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.obs-scroll{height:100%;overflow-y:auto;padding:4px}
/* ============ SETTINGS modal ============ */
.modal-scrim{position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:.22s}
.modal-scrim.on{opacity:1;pointer-events:auto}
.modal{width:min(560px,94vw);max-height:88vh;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;transform:scale(.96);transition:transform .22s}
.modal-scrim.on .modal{transform:scale(1)}
.modal-hd{display:flex;align-items:center;gap:11px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-hd .mi{width:34px;height:34px;border-radius:10px;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center}
.modal-hd h2{margin:0;font-size:15px;font-weight:800}
.modal-hd .ms{font-family:var(--mono);font-size:9px;color:var(--ink3)}
.modal-hd .mx{margin-left:auto;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:grid;place-items:center;color:var(--ink3)}
.modal-hd .mx:hover{border-color:var(--red);color:var(--red)}
.modal-body{padding:8px 18px 18px;overflow-y:auto}
.set-sec{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--ink3);text-transform:uppercase;margin:16px 2px 8px;font-weight:600}
.set-row{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);margin-bottom:8px}
.set-row .si{width:30px;height:30px;border-radius:8px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);flex-shrink:0}
.set-row .st{font-weight:600;font-size:12.5px}
.set-row .sd{font-size:10.5px;color:var(--ink3);margin-top:1px}
.set-row .sc{margin-left:auto}
.tgl{width:40px;height:22px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;transition:.18s;border:none}
.tgl.on{background:var(--teal)}
.tgl::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tgl.on::after{transform:translateX(18px)}
.segsm{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.segsm b{padding:5px 11px;font-size:11px;color:var(--ink2);cursor:pointer;border-right:1px solid var(--line2)}
.segsm b:last-child{border-right:none}.segsm b.on{background:var(--teal);color:#fff}
.fadein{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.note{display:flex;gap:9px;padding:9px 13px;background:rgba(245,158,11,.1);border-left:3px solid var(--amber);border-radius:9px;font-size:11.5px;color:var(--ink2);margin-top:12px}
/* ============ REPORT MANAGER · document-controller / working folders ============ */
.dc{display:grid;grid-template-columns:220px 1fr;gap:16px;height:100%;min-height:0}
.dc-side{border:1px solid var(--line);border-radius:14px;background:var(--panel2);overflow-y:auto;padding:10px;min-height:0}
.dc-sh{font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--ink3);padding:10px 8px 5px;font-weight:600}
.dc-fold{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink2);font-size:12px;margin-bottom:2px}
.dc-fold:hover{background:var(--line2)}
.dc-fold.on{background:var(--teal-soft);color:var(--teal-ink);font-weight:600}
.dc-fold .fi{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.dc-fold .cnt{margin-left:auto;font-family:var(--mono);font-size:8px;color:var(--ink3)}
.dc-main{display:flex;flex-direction:column;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.dc-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dc-crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3)}
.dc-crumb b{color:var(--ink);font-weight:700}
.dc-search{flex:1;min-width:120px;max-width:280px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);padding:6px 10px}
.dc-search input{border:none;background:none;outline:none;font-family:var(--sans);font-size:12px;color:var(--ink);width:100%}
.dc-view{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2)}
.dc-view b{padding:5px 9px;font-size:12px;color:var(--ink2);cursor:pointer;border-right:1px solid var(--line2)}
.dc-view b:last-child{border-right:none}.dc-view b.on{background:var(--teal);color:#fff}
.dc-body{flex:1;overflow-y:auto;padding:16px;min-height:0}
.dc-sech{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--ink3);margin:6px 2px 10px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.dc-sech::after{content:'';flex:1;height:1px;background:var(--line2)}
.dc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;margin-bottom:22px}
.folder,.filecard{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;transition:.14s;overflow:hidden}
.folder:hover,.filecard:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.folder{padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px}
.folder .fico{width:40px;height:32px;border-radius:6px 10px 10px 10px;position:relative;flex-shrink:0}
.folder .fico::before{content:'';position:absolute;top:-4px;left:0;width:18px;height:6px;border-radius:3px 3px 0 0;background:inherit}
.folder .fn{font-weight:700;font-size:12.5px;color:var(--ink)}
.folder .fm{font-family:var(--mono);font-size:8.5px;color:var(--ink3)}
.filecard .thumb{height:80px;display:grid;place-items:center;font-size:26px;position:relative;border-bottom:1px solid var(--line2)}
.filecard .tag{position:absolute;top:6px;left:6px;font-family:var(--mono);font-size:7px;font-weight:700;padding:2px 5px;border-radius:4px;color:#fff}
.filecard .meta{padding:9px 11px}
.filecard .fnm{font-weight:600;font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filecard .fsub{font-family:var(--mono);font-size:8px;color:var(--ink3);margin-top:3px;display:flex;justify-content:space-between}
/* list view */
.dc-list{width:100%;border-collapse:collapse;font-size:12px}
.dc-list th{text-align:left;font-family:var(--mono);font-size:8.5px;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase}
.dc-list td{padding:8px 10px;border-bottom:1px dashed var(--line2);color:var(--ink2)}
.dc-list tr{cursor:pointer}.dc-list tr:hover td{background:var(--line2)}
.dc-list .nm{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:600}
/* ============ REPORT TEMPLATES (daily production / drilling / KPI) ============ */
.tpl-wrap{display:grid;grid-template-columns:250px 1fr;gap:16px;height:100%;min-height:0}
.tpl-rail{border:1px solid var(--line);border-radius:14px;background:var(--panel2);overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.tplitem{border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;transition:.14s;padding:11px 12px;display:flex;gap:11px;align-items:flex-start}
.tplitem:hover{border-color:var(--teal)}
.tplitem.on{border-color:var(--teal);background:var(--teal-soft)}
.tplitem .ti{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px;color:#fff;flex-shrink:0}
.tplitem .tn{font-weight:700;font-size:12.5px;color:var(--ink)}
.tplitem .td{font-size:10.5px;color:var(--ink3);margin-top:2px;line-height:1.4}
.tpl-main{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.tpl-doc-scroll{flex:1;overflow:auto;min-height:0;background:var(--panel3);display:flex;flex-direction:column;align-items:center;padding:16px 0 24px}
.tpl-page{background:#fff;color:#1a1a1a;box-shadow:var(--shadow-lg);border:1px solid var(--line);flex-shrink:0;transition:width .25s,min-height .25s;font-family:'Inter',sans-serif;padding:40px 46px;position:relative}
.tpl-page .tph{border-bottom:2px solid var(--teal);padding-bottom:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:flex-end}
.tpl-page .tph .tt{font-size:19px;font-weight:800;color:#0f172a}
.tpl-page .tph .co{font-size:8.5px;letter-spacing:.14em;color:#0a8a7f;font-weight:800;text-transform:uppercase}
.tpl-page .tph .dt{font-size:9px;color:#94a3b8;text-align:right}
.tpl-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.tpl-kpi{border:1px solid #e6ebf2;border-radius:9px;padding:9px 11px;background:#f8fafc}
.tpl-kpi .k{font-size:8px;letter-spacing:.05em;color:#94a3b8;font-family:'JetBrains Mono',monospace}
.tpl-kpi .v{font-size:19px;font-weight:800;color:#0f172a;margin-top:3px}
.tpl-kpi .s{font-size:8.5px;color:#64748b;margin-top:2px}
.tpl-tbl{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:14px}
.tpl-tbl th{background:#0f172a;color:#fff;text-align:left;padding:5px 8px;font-family:'JetBrains Mono',monospace;font-size:8px}
.tpl-tbl td{padding:5px 8px;border-bottom:1px solid #eef1f5;color:#334155}
.tpl-tbl tr:nth-child(even) td{background:#f8fafc}
.tpl-bars{display:flex;align-items:flex-end;gap:8px;height:96px;padding:8px 0;border-bottom:1px solid #eef1f5;margin-bottom:14px}
.tpl-bars i{flex:1;background:linear-gradient(#5fe3cf,#0FB5A6);border-radius:3px 3px 0 0}
.tpl-sec{font-size:12px;font-weight:800;color:#0f172a;margin:0 0 8px}
.tpl-sk{height:8px;border-radius:4px;background:#eef1f5;margin:6px 0}
.tpl-sk.s70{width:70%}.tpl-sk.s85{width:85%}.tpl-sk.s50{width:50%}
/* report hierarchy tree (north-star → lifecycle → reports) */
.rt-grouphd{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:8px;letter-spacing:.14em;color:var(--ink3);margin:12px 6px 6px;font-weight:600}
.rt-grouphd:first-child{margin-top:2px}
.rt-grouphd .gi{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:10px;color:#fff}
.rt-kpi{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--panel);cursor:pointer;margin-bottom:5px;transition:.14s;position:relative}
.rt-kpi:hover{border-color:var(--teal)}
.rt-kpi.on{border-color:var(--teal);background:var(--teal-soft)}
.rt-kpi .ki{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;color:#fff;flex-shrink:0}
.rt-kpi .kn{font-weight:700;font-size:12px;color:var(--ink)}
.rt-kpi .ks{font-family:var(--mono);font-size:8px;color:var(--ink3);margin-top:1px}
.rt-kpi .kchev{margin-left:auto;color:var(--ink3);font-size:10px;transition:transform .2s}
.rt-kpi.exp .kchev{transform:rotate(90deg)}
.rt-star{border-width:2px}
.rt-child{display:flex;align-items:center;gap:8px;padding:7px 10px 7px 14px;margin:0 0 3px 16px;border-left:2px solid var(--line);cursor:pointer;color:var(--ink2);font-size:11.5px;position:relative}
.rt-child::before{content:'';position:absolute;left:-1px;top:50%;width:10px;height:1px;background:var(--line)}
.rt-child:hover{color:var(--teal-ink)}
.rt-child.on{color:var(--teal-ink);font-weight:600;border-left-color:var(--teal)}
.rt-child .ci{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:10px;flex-shrink:0}
.rt-child .cfreq{margin-left:auto;font-family:var(--mono);font-size:7.5px;color:var(--ink3)}
.rt-crumb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);font-family:var(--mono)}
.rt-crumb b{color:var(--ink);font-weight:700}
.tpl-badge{font-family:var(--mono);font-size:7.5px;padding:2px 7px;border-radius:20px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.05em}
/* ============ REPORT · Word/PPT enhanced controls ============ */
.rselect{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:11px;color:var(--ink2);cursor:pointer;position:relative;font-family:var(--sans)}
.rselect:hover{border-color:var(--teal);color:var(--teal-ink)}
.rselect .lab{font-family:var(--mono);font-size:8px;color:var(--ink3);letter-spacing:.05em}
.rselect select{border:none;background:none;font-family:var(--sans);font-size:11px;color:inherit;cursor:pointer;outline:none;padding:0 2px}
.rseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2);height:30px}
.rseg b{display:inline-flex;align-items:center;padding:0 10px;font-size:11px;color:var(--ink2);cursor:pointer;font-weight:500;border-right:1px solid var(--line2)}
.rseg b:last-child{border-right:none}
.rseg b.on{background:var(--teal);color:#fff}
.rzoom{display:inline-flex;align-items:center;gap:2px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);overflow:hidden}
.rzoom button{width:26px;height:28px;border:none;background:none;font-size:14px;color:var(--ink2)}
.rzoom button:hover{background:var(--line2);color:var(--teal-ink)}
.rzoom .zv{min-width:42px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink2)}
.doc-scroll{flex:1;overflow:auto;min-height:0;padding:8px 0 30px;display:flex;flex-direction:column;align-items:center;gap:20px;background:var(--panel3)}
/* pannable / zoomable document canvas (Figma/Miro-style) */
.doc-canvas{flex:1;min-height:0;position:relative;overflow:hidden;background:
  radial-gradient(circle at 1px 1px,var(--line2) 1px,transparent 0) 0 0/24px 24px, var(--panel3);cursor:grab;touch-action:none}
.doc-canvas.grabbing{cursor:grabbing}
.doc-plane{position:absolute;top:0;left:0;transform-origin:0 0;display:flex;flex-direction:column;align-items:center;gap:22px;will-change:transform}
.doc-fit{position:absolute;bottom:14px;right:16px;z-index:4;display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--shadow)}
.doc-fit button{width:30px;height:30px;border:none;background:none;border-radius:8px;color:var(--ink2);font-size:15px;display:grid;place-items:center}
.doc-fit button:hover{background:var(--line2);color:var(--teal-ink)}
.doc-fit .dz{min-width:44px;display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--ink2)}
.doc-hint{position:absolute;bottom:14px;left:16px;z-index:4;font-family:var(--mono);font-size:8.5px;color:var(--ink3);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;box-shadow:var(--shadow)}
.doc-page{background:#fff;color:#1a1a1a;box-shadow:var(--shadow-lg);border:1px solid var(--line);font-family:'Georgia',serif;line-height:1.7;position:relative;flex-shrink:0;transition:width .25s,min-height .25s}
.doc-page .ban{border-bottom:3px solid var(--teal);padding-bottom:10px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end}
.doc-page .ban .co{font-family:'Inter',sans-serif;font-size:9px;letter-spacing:.16em;color:#0a8a7f;font-weight:800;text-transform:uppercase}
.doc-page .ban .dt{font-family:'Inter',sans-serif;font-size:9px;color:#94a3b8}
.doc-page h1{font-size:24px;margin:0 0 4px;font-family:'Georgia',serif}
.doc-page .sub{font-family:'Inter',sans-serif;font-size:11px;color:#64748b;margin-bottom:18px}
.doc-page h2{font-size:15px;margin:20px 0 8px;font-family:'Inter',sans-serif;color:#0f172a}
.doc-page .cols{column-gap:26px}
.doc-page .pnum{position:absolute;bottom:14px;right:0;left:0;text-align:center;font-family:'Inter',sans-serif;font-size:9px;color:#b0b8c4}
.deck-slide{position:relative;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow-lg);overflow:hidden;flex-shrink:0;transition:width .25s,height .25s;color:#fff;background:radial-gradient(700px 320px at 20% 0%,#0e3346,#071b2f 60%)}
.deck-slide.theme-light{background:radial-gradient(700px 320px at 20% 0%,#ffffff,#eef4f9 60%);color:#0f172a;border-color:#dbe4ee}
.deck-slide.theme-teal{background:linear-gradient(135deg,#0FB5A6,#0a5f6b)}
.deck-slide.theme-violet{background:linear-gradient(135deg,#3b1f6b,#7c3aed)}
.deck-canvasarea{position:absolute;inset:0;padding:6% 7%;display:flex;flex-direction:column;justify-content:center}
.deck-slide .kick{font-family:var(--mono);font-size:clamp(8px,1.1vw,11px);letter-spacing:.16em;color:#5fe3cf;text-transform:uppercase}
.deck-slide.theme-light .kick{color:#0a8a7f}
.deck-slide h1{font-size:clamp(18px,3vw,34px);margin:8px 0 10px;font-weight:800;line-height:1.1}
.deck-slide p{font-size:clamp(10px,1.4vw,15px);opacity:.92;max-width:74%;line-height:1.5;margin:0}
.deck-slide .sbadge{position:absolute;top:20px;right:24px;font-family:var(--mono);font-size:9px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3)}
.deck-slide.theme-light .sbadge{background:rgba(15,23,42,.07);border-color:rgba(15,23,42,.12);color:#475569}
.deck-slide .orbmini{position:absolute;bottom:20px;right:24px;width:40px;height:40px;border-radius:50%;background:conic-gradient(from 0deg,#0FB5A6,#22d3ee,#2563eb,#7c3aed,#0FB5A6);filter:blur(1px);opacity:.85;animation:spin 6s linear infinite}
/* layout placeholders inside slide */
.dl-ph{border:1.5px dashed rgba(255,255,255,.35);border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.6)}
.deck-slide.theme-light .dl-ph{border-color:rgba(15,23,42,.2);color:#94a3b8}
.statusbar{display:flex;align-items:center;gap:14px;padding:6px 14px;border-top:1px solid var(--line);background:var(--panel);font-family:var(--mono);font-size:9.5px;color:var(--ink3);flex-shrink:0}
.statusbar .sp{flex:1}
/* deck stage centering (fit-to-screen) */
.deck-stage{flex:1;overflow:hidden;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px;background:var(--panel3);position:relative}
.deck-nav{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 6px;box-shadow:var(--shadow)}
.deck-nav .nb{width:28px;height:28px;border:none;background:none;border-radius:14px;font-size:14px;color:var(--ink2)}
.deck-nav .nb:hover{background:var(--line2);color:var(--teal-ink)}
.deck-nav .nc{font-family:var(--mono);font-size:10px;color:var(--ink3);min-width:44px;text-align:center}
/* insert chips */
.insrow{display:flex;gap:4px;align-items:center}
.ins{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:11px;color:var(--ink2)}
.ins:hover{border-color:var(--teal);color:var(--teal-ink)}
/* slide content blocks */
.deck-slide .footerbar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:6px 4%;font-family:'Inter',sans-serif;font-size:clamp(7px,1vw,10px);opacity:.7}
.deck-slide.theme-light .footerbar{color:#64748b}
.chartph{display:flex;align-items:flex-end;gap:6%;height:100%;padding:6% 0 12%}
.chartph i{flex:1;background:rgba(95,227,207,.55);border-radius:4px 4px 0 0}
.deck-slide.theme-light .chartph i{background:rgba(15,181,166,.5)}
.tableph{width:100%;border-collapse:collapse;font-size:clamp(7px,1vw,11px)}
.tableph td{border:1px solid rgba(255,255,255,.25);padding:4% 3%}
.deck-slide.theme-light .tableph td{border-color:rgba(15,23,42,.15)}
/* notes panel */
.notes{flex-shrink:0;border-top:1px solid var(--line);background:var(--panel);padding:8px 14px;max-height:120px;overflow:auto}
.notes .nh{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--ink3);margin-bottom:5px}
.notes textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);font-family:var(--sans);font-size:12px;padding:8px 10px;resize:none;min-height:52px}
.notes textarea:focus{outline:none;border-color:var(--teal)}
/* transition menu inline */
.tchip{display:inline-flex;align-items:center;gap:5px}
/* PRESENT MODE overlay */
.present{position:fixed;inset:0;z-index:400;background:#05070d;display:none;flex-direction:column;align-items:center;justify-content:center}
.present.on{display:flex}
.present .pslide{position:relative;border-radius:8px;overflow:hidden;box-shadow:0 30px 100px rgba(0,0,0,.7);color:#fff;background:radial-gradient(700px 320px at 20% 0%,#0e3346,#071b2f 60%)}
.present .pslide.theme-light{background:radial-gradient(700px 320px at 20% 0%,#fff,#eef4f9 60%);color:#0f172a}
.present .pslide.theme-teal{background:linear-gradient(135deg,#0FB5A6,#0a5f6b)}
.present .pslide.theme-violet{background:linear-gradient(135deg,#3b1f6b,#7c3aed)}
.present .pbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;color:#94a3b8;font-family:var(--mono);font-size:11px}
.present .pbar button{width:34px;height:34px;border-radius:50%;border:1px solid #24324a;background:#0e1626;color:#cbd5e1;font-size:15px}
.present .pbar button:hover{border-color:var(--teal);color:#fff}
.present .pexit{position:fixed;top:18px;right:20px;border:1px solid #24324a;background:#0e1626;color:#cbd5e1;border-radius:8px;padding:6px 12px;font-size:12px}
.present .pexit:hover{border-color:var(--red);color:#fff}
.present .pcanvasarea{position:absolute;inset:0;padding:6% 7%;display:flex;flex-direction:column;justify-content:center}
.present .kick{font-family:var(--mono);font-size:clamp(11px,1.4vw,15px);letter-spacing:.16em;color:#5fe3cf;text-transform:uppercase}
.present .pslide.theme-light .kick{color:#0a8a7f}
.present h1{font-size:clamp(28px,4.6vw,58px);margin:12px 0 16px;font-weight:800;line-height:1.08}
.present p{font-size:clamp(14px,1.9vw,22px);opacity:.9;max-width:76%;line-height:1.5;margin:0}

/* ============================================================
   MOBILE RESPONSIVE SHELL (ported 1:1 from master) —
   bottom nav · off-canvas drawer · sheet · galaxy orb ·
   cosmonaut full-screen chat with slide-over drawers
   ============================================================ */
:root{ --mnav-h:64px; }
.mham,.mnav,.mscrim,.msheet{display:none}
/* hamburger */
.mham{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--panel);align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;padding:0}
.mham svg{width:19px;height:19px;stroke:var(--ink);stroke-width:1.9;fill:none;stroke-linecap:round}
/* bottom nav */
.mnav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--mnav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--panel);border-top:1px solid var(--line);align-items:flex-start;z-index:170;box-shadow:0 -4px 22px rgba(15,23,42,.07)}
.mtab{flex:1 1 0;min-width:0;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 0;color:var(--ink3);cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.mtab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mtab span{font-size:9.5px;font-weight:600;letter-spacing:.01em}
.mtab.on{color:var(--teal-ink)}
.mtab-orb{flex:1 1 0;margin-top:-24px;justify-content:flex-start;gap:1px}
.mtab-orb .mtab-orb-lbl{font-size:9.5px;font-weight:700;color:var(--ink2);margin-top:1px}
.mtab:active{transform:scale(.93)}
/* scrim */
.mscrim{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(2px);z-index:160;opacity:0;transition:opacity .25s}
body.drawer-open .mscrim,body.sheet-open .mscrim{display:block;opacity:1}
body.drawer-open .mscrim{z-index:185}
/* bottom sheet */
.msheet{position:fixed;left:0;right:0;bottom:0;z-index:165;background:var(--panel);border-radius:22px 22px 0 0;box-shadow:0 -12px 44px rgba(15,23,42,.24);padding:10px 16px calc(var(--mnav-h) + env(safe-area-inset-bottom) + 22px);transform:translateY(115%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
body.sheet-open .msheet{display:block;transform:translateY(0)}
.msheet-grip{width:42px;height:4px;border-radius:3px;background:var(--line);margin:2px auto 14px}
.msheet-title{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink3);margin-bottom:10px;text-transform:uppercase}
.msheet-items{display:flex;flex-direction:column;gap:8px}
.msheet-item{display:flex;align-items:center;gap:13px;padding:14px 13px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:var(--panel2)}
.msheet-item.on{border-color:var(--teal);background:var(--teal-soft)}
.msheet-item .mi-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);font-size:16px;color:var(--teal-ink);flex:0 0 auto}
.msheet-item .mi-t{font-weight:700;font-size:14px}
.msheet-item .mi-s{font-size:11.5px;color:var(--ink3)}

@media (max-width:820px){
  .mham{display:inline-flex}
  .mnav{display:flex}
  .app{grid-template-columns:1fr;grid-template-rows:54px 1fr;height:100dvh}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:286px;max-width:86vw;z-index:190;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:none}
  body.drawer-open .sidebar{transform:translateX(0);box-shadow:0 0 50px rgba(15,23,42,.35)}
  .topbar{grid-column:1;padding:0 12px;gap:10px}
  .main{grid-column:1}
  .footer{display:none}
  .orb-host{display:none}                 /* fixed corner orb hidden on mobile (lives in nav) */
  .tbadge,.newbtn{display:none}
  .crumbs>span:not(.cur){display:none}
  .content{padding:14px 13px calc(var(--mnav-h) + 22px)}
  .content.noscroll{overflow:auto}
  .tabs{padding:6px 10px 0}
  /* cockpit stacks */
  .cockpit{display:block;height:auto;overflow:visible}
  .ck-hero{flex-wrap:wrap}
  .ck-hero .badges{margin-left:0;width:100%;margin-top:4px;flex-direction:row}
  .ck-kpis{grid-template-columns:repeat(2,1fr);margin-bottom:12px}
  .ck-main{grid-template-columns:1fr;gap:12px}
  .ck-main .panel{min-height:240px}
  .grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr}
  /* full-height canvas views fit above nav */
  .ws,.de-wrap,.doc-wrap,.deck-wrap,.daily-wrap,.dc,.tpl-wrap{grid-template-columns:1fr!important;height:calc(100dvh - 54px - var(--mnav-h) - 18px)!important}
  .insp,.pp,.doc-rail,.deck-rail,.daily-rail{display:none}
  /* report manager mobile: department chips scroll horizontally, hide side tree */
  .dc-side{position:absolute;left:0;right:0;top:0;bottom:0;z-index:5;display:none}
  .dc.show-side .dc-side{display:block}
  .dc-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  .dc-bar{gap:7px}.dc-search{max-width:none}
  /* report hub / templates mobile: rail becomes a scrollable band on top */
  .tpl-wrap{display:flex!important;flex-direction:column}
  .tpl-rail{display:block!important;flex:0 0 auto;max-height:38vh;overflow-y:auto}
  .tplitem{min-width:210px}
  .ribbon{overflow-x:auto}
  .rgrp{flex-wrap:nowrap}
  .rt-crumb{white-space:nowrap}
  /* COSMONAUT mobile = full-screen chat, History/Browser as slide-over drawers */
  body.cosmo-on .mnav{display:none}
  .cosmo-canvas{z-index:220;width:100vw!important;max-width:100vw;grid-template-rows:46px 1fr}
  .cc-body{grid-template-columns:1fr!important;display:block!important;position:relative;overflow:hidden}
  .cc-mid{position:absolute!important;inset:0;display:flex!important}
  .cc-body .cc-left,.cc-body .cc-right{position:absolute;top:0;bottom:0;z-index:20;display:flex!important;box-shadow:0 0 44px rgba(15,23,42,.34);transition:transform .28s cubic-bezier(.4,0,.2,1);will-change:transform}
  .cc-body .cc-left{left:0;width:84%!important;max-width:320px;transform:translateX(-103%)}
  .cc-body .cc-right{right:0;left:0;width:100%!important;max-width:100%;transform:translateX(103%)}
  .cc-body.m-left  .cc-left {transform:translateX(0)}
  .cc-body.m-right .cc-right{transform:translateX(0)}
  .cc-scrim{position:absolute;inset:0;z-index:15;background:rgba(15,23,42,.42);backdrop-filter:blur(1px);opacity:0;pointer-events:none;transition:opacity .25s;display:block}
  .cc-body.m-left .cc-scrim,.cc-body.m-right .cc-scrim{opacity:1;pointer-events:auto}
  .cc-composer{padding-bottom:calc(9px + env(safe-area-inset-bottom))}
  .cc-usage{flex-wrap:wrap;gap:7px 12px}
  .cc-menu{width:min(320px,86vw)}
  .cc-tray{flex-wrap:wrap}
  #ccFullBtn{display:none}
}
@media print{.sidebar,.topbar,.footer,.tabs,.mnav,.mscrim,.msheet,.mham,.cosmo-canvas,.orb-host{display:none!important}.app{display:block}.main,.content{overflow:visible!important}}
