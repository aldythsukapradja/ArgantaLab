# Render blueprint — deploys The Bridge (apps/mcp) as an always-on MCP endpoint
# so Claude / ChatGPT mobile can reach it over HTTPS.
#
# The whole repo is checked out, so apps/mcp's relative import of the HQ engine
# (../../hq/src/data/graph) resolves at runtime — no bundling needed.
#
#   Render dashboard → New → Blueprint → pick this repo → Apply.
#   Render injects PORT automatically; the server reads it.
#   Your link is:  https://<service>.onrender.com/mcp
#
#   Auth: left OFF so ChatGPT/Claude connect with "No Auth". The Bridge is
#   READ-ONLY and serves only the deterministic seed (no secrets, no writes), so
#   an open endpoint is low-risk. To lock it down later, add a BRIDGE_TOKEN env
#   var here (generateValue: true) and use header `Authorization: Bearer <token>`.
services:
  - type: web
    name: circle-hq-bridge
    runtime: node
    plan: free
    rootDir: apps/mcp
    buildCommand: npm install
    startCommand: npm run http
    healthCheckPath: /healthz
    envVars:
      - key: MCP_TRANSPORT
        value: http
